# Permissões da equipe: a fonte única (história 1.3, AR-22, AD-9).
#
# - areas: as 15 áreas do trilho do painel, na ordem do menu, e os perfis que abrem cada uma por
#   padrão. O dono muda por perfil (gerente e recepção) as áreas liberadas em /admin/equipe/
#   permissoes (1.15, FR-82); o dono sempre tem todas.
# - operations: cada operação de equipe do contrato (docs/api/openapi.yaml), "MÉTODO /caminho":
#     permission  <entidade>.<verbo>
#     area        a área do trilho da operação (null = da própria sessão: entrar, sair, PIN,
#                 aparelho, minha conta, nomes das áreas, avisos ao vivo, central de avisos)
#     also        outras áreas cujas telas usam a operação (ela passa com qualquer uma delas)
#     roles       os perfis que podem, por padrão
#     sensitive   ação do FR-74: pede a confirmação de identidade dos últimos 5 minutos
#                 (POST /staff/auth/reauth); sem ela, 403 reauth_required
#     sensitive_fields  sensível só quando o corpo traz um destes campos (mudar o perfil)
#     actions     cada valor de action da operação e os perfis que podem usá-lo
#     options     partes da operação que só alguns perfis têm, com os perfis: any_day (outro dia
#                 que não hoje), private_notes (nota interna e restrição alimentar), override
#                 (passar do limite), closed_night (corrigir a noite já fechada, com motivo),
#                 print (imprimir a lista da porta)
#     note        o que a checagem ainda decide dentro da operação
#
# A checagem (servidor e simulação, src/mocks/permissoes.js) junta as duas coisas: o perfil
# está em roles e uma das áreas da operação (area ou also) está liberada para ele; o dono passa
# sempre. Operação fora deste arquivo, ou qualquer dúvida, é acesso negado. Um teste confere que
# toda operação de equipe do contrato está aqui (tests/unit/contract-permissoes.test.mjs).
# As telas do painel não guardam lista de perfis: perguntam a este arquivo (canDo, canDoAction e
# canDoOption em src/admin/nav.js), e um teste recusa "role ===" nas telas.
# src/admin/permissoes.json é gerado deste arquivo (npm run permissoes) e lido pelo menu.
version: 1
roles: [owner, manager, floor]

areas:
  hoje: { label: Hoje, roles: [owner, manager, floor] }
  reservas: { label: Reservas, roles: [owner, manager, floor] }
  salao: { label: Salão, roles: [owner, manager, floor] }
  espera: { label: Espera, roles: [owner, manager, floor] }
  agenda: { label: Agenda, roles: [owner, manager] }
  plantas: { label: Plantas, roles: [owner, manager] }
  eventos: { label: Eventos, roles: [owner, manager] }
  clientes: { label: Clientes, roles: [owner, manager] }
  site: { label: Site, roles: [owner, manager] }
  cardapio: { label: Cardápio, roles: [owner, manager, floor] }
  galeria: { label: Galeria, roles: [owner, manager] }
  equipe: { label: Equipe, roles: [owner] }
  configuracoes: { label: Configurações, roles: [owner, manager] }
  registro: { label: Registro, roles: [owner] }
  sistema: { label: Sistema, roles: [owner] }

