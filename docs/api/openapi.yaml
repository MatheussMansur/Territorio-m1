    # ---------- configurações (AD-29; catálogo configuracoes.md)
    SettingsIndex:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              group: { $ref: '#/components/schemas/SettingsGroup' }
              version: { type: string }
              updated_by: { type: [string, 'null'], description: 'Nome de quem gravou por último' }
              updated_at: { type: [string, 'null'], format: date-time }
              pending: { type: array, items: { type: string }, description: 'O que falta: tradução, valor a confirmar, integração com problema' }
              editable: { type: boolean, description: 'Falso para o gerente e para integrations' }
              requires_recent_auth: { type: boolean, description: 'Gravar pede senha e TOTP recentes (AD-23)' }
              summary: { type: [string, 'null'], description: 'O valor atual em poucas palavras (índice no celular, 2.6)' }
        owner_name: { type: string }
        modules: { type: array, items: { type: string }, description: 'Módulos ligados (base, 1)' }
    SettingsDocument:
      type: object
      required: [group, version, data]
      properties:
        group: { $ref: '#/components/schemas/SettingsGroup' }
        version: { type: string, description: 'Vai no If-Match da gravação' }
        updated_by: { type: [string, 'null'] }
        updated_at: { type: [string, 'null'], format: date-time }
        data: { $ref: '#/components/schemas/SettingsData' }
        meta: { type: object, description: 'Por campo: tipo, limites, opções, categoria ("Futuras", "Todas", "Sim") e se é sensível (2.2)', additionalProperties: {} }
        pending: { type: array, items: { type: string } }
        context: { type: object, description: 'Números para a barra de impacto (reservas futuras, de hoje, lembretes, espera)', additionalProperties: {} }
      allOf:
        - { if: { properties: { group: { const: house } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsHouse' } } } }
        - { if: { properties: { group: { const: hours } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsHours' } } } }
        - { if: { properties: { group: { const: access } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsAccess' } } } }
        - { if: { properties: { group: { const: alerts } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsAlerts' } } } }
        - { if: { properties: { group: { const: appearance } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsAppearance' } } } }
        - { if: { properties: { group: { const: booking } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsBooking' } } } }
        - { if: { properties: { group: { const: terms } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsTerms' } } } }
        - { if: { properties: { group: { const: approval_no_shows } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsApprovalNoShows' } } } }
        - { if: { properties: { group: { const: waitlist } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsWaitlist' } } } }
        - { if: { properties: { group: { const: floor } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsFloor' } } } }
        - { if: { properties: { group: { const: messages } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsMessages' } } } }
        - { if: { properties: { group: { const: events } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsEvents' } } } }
        - { if: { properties: { group: { const: site } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsSite' } } } }
        - { if: { properties: { group: { const: menu } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsMenu' } } } }
        - { if: { properties: { group: { const: privacy } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsPrivacy' } } } }
        - { if: { properties: { group: { const: cookies } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsCookies' } } } }
        - { if: { properties: { group: { const: integrations } } }, then: { properties: { data: { $ref: '#/components/schemas/SettingsIntegrations' } } } }
    SettingsData:
      description: 'Os dados do grupo, validados pelo schema dele (o grupo vem no caminho)'
      anyOf:
        - $ref: '#/components/schemas/SettingsHouse'
        - $ref: '#/components/schemas/SettingsHours'
        - $ref: '#/components/schemas/SettingsAccess'
        - $ref: '#/components/schemas/SettingsAlerts'
        - $ref: '#/components/schemas/SettingsAppearance'
        - $ref: '#/components/schemas/SettingsBooking'
        - $ref: '#/components/schemas/SettingsTerms'
        - $ref: '#/components/schemas/SettingsApprovalNoShows'
        - $ref: '#/components/schemas/SettingsWaitlist'
        - $ref: '#/components/schemas/SettingsFloor'
        - $ref: '#/components/schemas/SettingsMessages'
        - $ref: '#/components/schemas/SettingsEvents'
        - $ref: '#/components/schemas/SettingsSite'
        - $ref: '#/components/schemas/SettingsMenu'
        - $ref: '#/components/schemas/SettingsPrivacy'
        - $ref: '#/components/schemas/SettingsCookies'
        - $ref: '#/components/schemas/SettingsIntegrations'
    SettingsPatch:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SettingsData', description: 'Só os campos que mudam' }
        simulation_hash: { type: string, description: 'Obrigatório no que recalcula reservas (hours e a categoria "Sim" do booking): o da prévia (AD-25)' }
        confirm_conflicts: { type: boolean, description: 'Grava mesmo com reservas sem mesa; a equipe assume esses casos' }
        notify_affected: { type: boolean, description: 'Avisa pelo WhatsApp quem teve a mesa ou o horário mexido' }
        resolutions: { type: array, items: { $ref: '#/components/schemas/Resolution' } }
    SettingsPreview:
      type: object
      properties:
        group: { $ref: '#/components/schemas/SettingsGroup' }
        valid: { type: boolean }
        errors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
        changes:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              before: {}
              after: {}
              scope: { $ref: '#/components/schemas/SettingsScope' }
        affected: { type: object, properties: { future_reservations: { type: integer, description: 'Reservas já feitas que a mudança alcança (escopo all)' }, dates: { type: integer } } }
        simulation: { type: array, items: { $ref: '#/components/schemas/DayPlanResult' }, description: 'Só para o que recalcula reservas' }
        simulation_hash: { type: [string, 'null'] }
        notes: { type: array, items: { type: string }, description: 'O que a mudança faz, em frases curtas para o "O que muda" (2.4)' }
    SettingsHouse:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 60, default: Território }
        tagline: { $ref: '#/components/schemas/LocalizedText', description: 'Até 60 caracteres; padrão "Cozinha com chão, afeto e festa"' }
        address: { $ref: '#/components/schemas/Address' }
        whatsapp: { type: string, description: E.164, default: '+5545998304994' }
        instagram: { type: string, format: uri }
        shop_url: { type: [string, 'null'], format: uri, description: 'Link da lojinha; vazio desliga' }
        legal_footer: { type: object, properties: { enabled: { type: boolean, default: false }, legal_name: { type: string }, cnpj: { type: string } } }
        timezone: { type: string, default: America/Sao_Paulo, readOnly: true }
        night_cutoff: { type: string, default: '05:00', readOnly: true, description: 'Virada da noite (Dev)' }
    SettingsHours:
      type: object
      description: 'Lido e gravado por domain.plans, o dono da semana padrão e do plano do dia (AD-29). Dias abertos, abertura e fechamento, turnos e planta padrão recalculam reservas: a gravação pede o simulation_hash da prévia (AD-25). Feriados e dias especiais ficam em /staff/day-plans.'
      properties:
        week: { type: array, items: { $ref: '#/components/schemas/OpeningHours' }, description: 'Padrão: quarta a sábado, 19:00–23:30' }
        closed_labels: { type: array, items: { type: object, properties: { weekday: { type: integer, minimum: 0, maximum: 6 }, label: { $ref: '#/components/schemas/LocalizedText' } } }, description: 'Motivo público dos dias fechados (segunda e terça "produção", domingo "fechado"); não recalcula' }
        max_shifts_per_day: { type: integer, minimum: 1, maximum: 2, default: 1 }
        confirmed: { type: boolean, description: 'Falso mostra o horário "a confirmar" no site' }
    SettingsAccess:
      type: object
      properties:
        session_hours: { type: integer, minimum: 1, maximum: 24, default: 12, description: 'Sessão no computador; vale para sessões novas (AD-23)' }
        remember_days: { type: integer, minimum: 1, maximum: 90, default: 30, description: '"Manter conectado neste aparelho"' }
        reception_idle_min: { type: integer, minimum: 5, maximum: 60, default: 15, description: 'Inatividade da pessoa ativa no aparelho' }
        pin_rule: { type: string, default: phone_last4, readOnly: true, description: 'PIN = últimos 4 dígitos do telefone da pessoa (Dev, AD-26)' }
        pin_max_attempts: { type: integer, minimum: 3, maximum: 10, default: 5, readOnly: true }
        pin_lock_min: { type: integer, default: 15, readOnly: true }
        totp_required_roles: { type: array, items: { $ref: '#/components/schemas/Role' }, default: [owner, manager], readOnly: true }
        reauth_valid_min: { type: integer, default: 5, readOnly: true }
    SettingsAlerts:
      type: object
      description: 'Quem da equipe recebe cada aviso na central do painel (FR-87). Os avisos à equipe saem só pelo painel: não há canal por pessoa. Lista vazia = só o dono.'
      properties:
        pending_to: { type: array, items: { type: string, format: uuid }, description: 'Quem recebe "pedido para aprovar" e "pedido vencendo" (padrão: dono e gerente)' }
        late_request_to: { type: array, items: { type: string, format: uuid }, description: 'Quem recebe "pedido em cima da hora" (padrão: dono e gerente)' }
        system_to: { type: array, items: { type: string, format: uuid }, description: 'Quem recebe os avisos do sistema (fila, limite, Google, cópias; padrão: dono)' }
        quiet_from: { type: string, default: '01:00' }
        quiet_to: { type: string, default: '09:00', description: 'Só os avisos críticos furam o silêncio' }
        privacy_request_to: { type: array, items: { type: string, format: uuid }, description: 'Quem recebe "pedido de dados" (padrão: dono)' }
        security_to: { type: array, items: { type: string, format: uuid }, description: 'Quem recebe PIN travado, aparelho sem chave e aparelho novo (padrão: dono)' }
    StaffAlertList:
      type: object
      description: 'GET /staff/alerts (FR-87)'
      properties:
        server_time: { type: string, format: date-time }
        quiet: { type: object, properties: { from: { type: string }, to: { type: string }, active: { type: boolean } } }
        unread: { type: integer, description: 'O número do sino' }
        critical: { type: integer, description: 'Críticos de pé (a faixa do topo)' }
        items: { type: array, items: { $ref: '#/components/schemas/StaffAlert' } }
    AlertPreferences:
      type: object
      description: '"Meus avisos": os avisos que o perfil recebe e os que a pessoa não segue'
      properties:
        muted: { type: array, items: { $ref: '#/components/schemas/StaffAlertKind' } }
        items:
          type: array
          items:
            type: object
            properties:
              code: { $ref: '#/components/schemas/StaffAlertKind' }
              level: { $ref: '#/components/schemas/StaffAlertLevel' }
              title: { type: string }
              clears: { type: string, description: 'Quando some, em palavras da casa' }
              can_mute: { type: boolean, description: 'false nos críticos' }
              following: { type: boolean }
    SettingsAppearance:
      type: object
      description: 'Paleta, tema escuro e fontes ficam no arquivo de tokens (Dev, AD-31); aqui só a leitura'
      properties:
        palette: { type: string, default: territorio, readOnly: true }
        dark_theme: { type: boolean, default: true, readOnly: true }
        visitor_theme: { type: string, default: system, readOnly: true, description: 'O tema do visitante segue o aparelho' }
    SettingsBooking:
      type: object
      description: 'first_arrival, last_arrival e slot_interval_min são da categoria "Sim": recalculam reservas e gravam pelo caminho do plano do dia (AD-25), com o simulation_hash da prévia. Mesas guardadas ficam na planta e no plano do dia.'
      properties:
        online_enabled: { type: boolean, default: true }
        window_days: { type: integer, minimum: 1, maximum: 120, default: 30 }
        min_lead_min: { type: integer, minimum: 0, maximum: 2880, default: 60 }
        first_arrival: { type: string, default: '19:00' }
        last_arrival: { type: string, default: '21:30' }
        slot_interval_min: { $ref: '#/components/schemas/SlotIntervalMin', default: 30 }
        party_max_online: { type: integer, minimum: 2, maximum: 20, default: 8 }
        large_group_action: { $ref: '#/components/schemas/LargeGroupAction', default: whatsapp }
        duration_min: { type: [integer, 'null'], minimum: 30, maximum: 300, default: 120, description: 'Tempo de mesa; vazio = livre. Futuras: as reservas já feitas mantêm' }
        duration_by_weekday: { type: array, items: { type: object, properties: { weekday: { type: integer, minimum: 0, maximum: 6 }, minutes: { type: [integer, 'null'], description: 'Vazio = livre nesse dia' } } } }
        duration_rules: { type: array, items: { type: object, properties: { party_max: { type: integer }, minutes: { type: integer } } }, description: 'Tempo de mesa por tamanho de grupo' }
        tolerance_min: { type: integer, minimum: 0, maximum: 60, default: 20, description: 'Todas: vale na hora' }
        extra_tolerance_min: { type: integer, minimum: 0, maximum: 30, default: 10, description: 'Todas' }
        after_tolerance: { $ref: '#/components/schemas/AfterTolerance', default: lose_priority }
        late_notice_enabled: { type: boolean, default: true, description: 'O cliente pode avisar que vai atrasar (botão no lembrete e no comprovante); ganha extra_tolerance_min' }
        cancel_until_hours: { type: integer, minimum: 0, maximum: 72, default: 2, description: 'Futuras' }
        customer_can_reschedule: { type: boolean, default: true }
        customer_can_cancel_late: { type: boolean, default: true, description: 'Depois do prazo conta como "em cima da hora"; falso = só pelo WhatsApp da casa' }
        max_active_per_phone: { type: integer, minimum: 1, maximum: 10, default: 2 }
        max_covers_per_slot: { type: [integer, 'null'], minimum: 1, description: 'Vazio = sem limite' }
        max_covers_night: { type: [integer, 'null'], minimum: 1 }
        few_left_pct: { type: integer, minimum: 5, maximum: 50, default: 20, description: 'Limiar de "últimas mesas"' }
        late_request_alert_hours: { type: integer, minimum: 0, maximum: 24, default: 3 }
        google_login: { type: boolean, default: true }
    SettingsTerms:
      type: object
      description: 'Cada gravação cria uma versão nova em terms_versions; a reserva guarda a versão aceita. Os números ({tolerância}, {prazo}, {tempo de mesa}) vêm do booking.'
      properties:
        version: { type: string, readOnly: true }
        items:
          type: array
          minItems: 1
          maxItems: 6
          items: { type: object, required: [text], properties: { title: { $ref: '#/components/schemas/LocalizedText' }, text: { $ref: '#/components/schemas/LocalizedText', description: 'Até 240 caracteres por língua' } } }
        show_duration_item: { type: boolean, default: false, description: 'Item opcional "A mesa é de vocês por {tempo de mesa}"' }
        accept_label: { $ref: '#/components/schemas/LocalizedText', description: 'Padrão "Li e tá combinado"' }
    SettingsApprovalNoShows:
      type: object
      properties:
        approval_mode: { $ref: '#/components/schemas/ApprovalMode', default: auto }
        rule_party_over: { type: integer, minimum: 2, maximum: 20, default: 8 }
        rule_no_shows_enabled: { type: boolean, default: true }
        rule_no_shows_count: { type: integer, minimum: 1, maximum: 5, default: 1 }
        rule_no_shows_window_months: { type: integer, minimum: 1, maximum: 24, default: 12 }
        pending_message: { $ref: '#/components/schemas/LocalizedText', description: 'Padrão "Recebemos seu pedido. A casa confirma até {hora}." (sem citar a falta)' }
        undo_no_show_hours: { type: integer, minimum: 0, maximum: 72, default: 24, description: 'Prazo do undo_no_show' }
        pending_expiry_hours: { type: integer, minimum: 1, maximum: 24, default: 4, description: 'Ou 30 min antes do horário, o que vier primeiro' }
        pending_expiry_before_min: { type: integer, default: 30 }
    SettingsWaitlist:
      type: object
      properties:
        online_enabled: { type: boolean, default: true }
        offer_min: { type: integer, minimum: 5, maximum: 60, default: 10, description: 'Todas' }
        offer_only_before_time: { type: boolean, default: true }
        max_per_slot: { type: integer, minimum: 1, maximum: 50, default: 10 }
        walk_in_enabled: { type: boolean, default: true, description: 'Espera de quem chega sem reserva, na porta' }
        notify_on_capacity_gain: { type: boolean, default: true }
    SettingsFloor:
      type: object
      properties:
        on_tolerance_end: { $ref: '#/components/schemas/ToleranceEndAction', default: suggest_no_show }
        release_hint_min: { type: integer, minimum: 0, maximum: 60, default: 15, description: 'Marca "para liberar" antes do fim do tempo de mesa, só se houver reserva ou espera para a mesa' }
        undo_check_in_min: { type: integer, minimum: 0, maximum: 60, default: 15 }
        walk_in_areas: { type: array, items: { $ref: '#/components/schemas/AreaKey' }, default: [balcao] }
        night_close_delay_min: { type: integer, minimum: 0, maximum: 240, default: 60 }
        print_sheet_at: { type: [string, 'null'], default: '19:00', description: 'Sugerir imprimir a folha da noite (com print_sheet_mode at_time)' }
        print_sheet_mode: { type: string, enum: [at_open, at_time, off], default: at_open, description: 'Quando sugerir imprimir a folha: na abertura, numa hora ou nunca (6.10)' }
        reception_can_finish: { type: boolean, default: true, description: 'Recepção pode marcar "acabou"' }
        reception_reschedule: { $ref: '#/components/schemas/ReceptionReschedule', default: same_day }
    SettingsMessages:
      type: object
      description: 'Mudar o texto de um modelo gera um pedido de aprovação na Meta; até aprovar, vale o anterior.'
      properties:
        reminder_enabled: { type: boolean, default: true }
        reminder_mode: { $ref: '#/components/schemas/ReminderMode', default: before_open }
        reminder_offset_min: { type: integer, minimum: 0, default: 180, description: 'Minutos antes da abertura (um lembrete por noite, AD-12)' }
        reminder_at: { type: [string, 'null'], description: 'Hora fixa, com reminder_mode = fixed_time' }
        reply_deadline_offset_min: { type: integer, default: 30, description: 'Minutos antes da abertura em que a falta de resposta vira no_reply' }
        reminder_buttons: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/LocalizedText' }, readOnly: true, description: 'Confirmo · Não vou mais · Vou atrasar um pouco' }
        auto_reply_enabled: { type: boolean, default: false }
        auto_reply_text: { $ref: '#/components/schemas/LocalizedText' }
        waitlist_joined_enabled: { type: boolean, description: 'Mensagem "você entrou na espera"' }
        waitlist_closed_enabled: { type: boolean, description: 'Mensagem "a espera fechou"' }
        ready_messages: { type: array, maxItems: 3, description: 'Só as 3 da casa; o dono edita o texto, sem criar novas no módulo 1 (2.14)', items: { type: object, properties: { template: { $ref: '#/components/schemas/ReadyMessageTemplate' }, text: { $ref: '#/components/schemas/LocalizedText' }, approved: { type: boolean, readOnly: true }, status: { type: string, enum: [approved, pending, rejected], readOnly: true, description: 'Situação na Meta' }, reason: { type: [string, 'null'], readOnly: true, description: 'Por que a Meta recusou' } } } }
        daily_cap: { type: integer, default: 300, readOnly: true, description: 'Teto diário de mensagens (Dev); acima dele a mensagem nasce held' }
    SettingsEvents:
      type: object
      properties:
        default_booking_mode: { $ref: '#/components/schemas/EventBookingMode', default: tables }
        site_agenda: { $ref: '#/components/schemas/EventsAgendaMode', default: only_with_event }
    SettingsSite:
      type: object
      properties:
        languages: { type: array, items: { $ref: '#/components/schemas/Locale' }, default: [pt, es, en] }
        default_language: { $ref: '#/components/schemas/Locale', default: pt }
    SettingsMenu:
      type: object
      description: 'Como o site mostra o cardápio (2.17). Categorias, itens, preços, selos, fotos e ordem são editados em /staff/menu (FR-13)'
      properties:
        unpriced_item: { $ref: '#/components/schemas/UnpricedItemMode', default: hide }
        show_sold_out: { type: boolean, default: true, description: 'Mostrar "acabou" no site' }
    SettingsPrivacy:
      type: object
      properties:
        customer_retention_months: { type: integer, minimum: 6, maximum: 60, default: 24, description: 'Depois da última visita, anonimiza' }
        dietary_retention_days: { type: integer, minimum: 1, maximum: 90, default: 30, description: 'Restrição alimentar e alergia, depois da visita' }
        audit_retention_months: { type: integer, minimum: 6, maximum: 60, default: 12 }
        subject_response_days: { type: integer, default: 15, readOnly: true, description: 'Prazo da LGPD para responder o titular' }
        dpo_contact: { type: string, description: 'Contato do encarregado de dados (e-mail ou WhatsApp da casa)' }
        privacy_version: { type: string, readOnly: true }
        privacy_published_at: { type: [string, 'null'], format: date-time, readOnly: true }
    SettingsCookies:
      type: object
      properties:
        categories: { type: array, items: { $ref: '#/components/schemas/CookieCategory' }, default: [necessary, remember, measurement], readOnly: true }
        banner_text: { $ref: '#/components/schemas/LocalizedText' }
        banner_version: { type: string, description: 'Mudar pede a escolha de novo aos visitantes' }
        measurement_enabled: { type: boolean, default: true, description: 'Medição (Umami) só com consentimento' }
    SettingsIntegrations:
      type: object
      description: 'Só leitura: segredos ficam no arquivo de ambiente; o dono vê só ligada ou com problema'
      readOnly: true
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/IntegrationItem' } }
    IntegrationItem:
      type: object
      description: 'Uma integração como o dono vê: ligada, com problema ou sem uso; nunca o segredo nem a resposta crua do serviço'
      properties:
        key: { type: string, description: 'IntegrationKey (whatsapp, google, turnstile, email…)' }
        label: { type: string }
        status: { $ref: '#/components/schemas/IntegrationStatus' }
        state: { type: string, enum: [ok, problem, unused, not_connected], description: 'A leitura ao vivo' }
        checked_at: { type: [string, 'null'], format: date-time }
        last_ok_at: { type: [string, 'null'], format: date-time }
        key_rotated_at: { type: [string, 'null'], format: date-time }
        environment: { type: [string, 'null'], example: produção }
        note: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
        ok: { type: boolean, description: '"Testar agora": o serviço respondeu' }
        test: { type: object, description: '"Testar agora": como respondeu, em quanto tempo e quando', properties: { ok: { type: boolean }, ms: { type: [integer, 'null'] }, at: { type: string, format: date-time }, message: { type: string } } }

    # ---------- aparelhos e PIN (AD-26)
    StaffSessionKind: { type: string, enum: [personal, device] }
    SlotIntervalMin: { type: integer, enum: [15, 30, 60], description: 'Intervalo entre horários de chegada, em minutos' }
    PairingRequest:
      type: object
      required: [public_key]
      properties:
        public_key: { type: object, description: 'Chave pública ECDSA P-256 em JWK (kty EC, crv P-256, x, y)' }
        label: { type: string, maxLength: 60, description: 'Sugestão de nome, ex.: "Computador da recepção"' }
        user_agent: { type: string }
        replaces: { type: [string, 'null'], format: uuid, description: 'O aparelho que perdeu a chave e este substitui (1.11)' }
    Pairing:
      type: object
      properties:
        id: { type: string, format: uuid, description: 'Também é o id do aparelho' }
        code: { type: string, pattern: '^[A-Z0-9]{8}$', description: 'Aparece na tela do aparelho; o dono confere ao aprovar. Só na resposta do POST' }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        expires_at: { type: string, format: date-time }
        poll_after_s: { type: integer, example: 3 }
        server_time: { type: string, format: date-time, description: 'Hora do servidor (o aparelho confere o relógio)' }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Computador da recepção }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        location: { type: string, example: Recepção }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        approved_by: { type: [string, 'null'] }
        approved_at: { type: [string, 'null'], format: date-time }
        last_seen_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        idle_min: { type: integer, description: 'Minutos sem uso até pedir o PIN de novo' }
        key_lost_at: { type: [string, 'null'], format: date-time, description: 'O aparelho perdeu a chave (1.11)' }
        public_key: { type: [object, 'null'], description: 'JWK da chave pública' }
        replaces: { type: [string, 'null'], format: uuid, description: 'O aparelho que este substitui (chave perdida)' }
        code: { type: [string, 'null'], description: 'O código do pedido pendente (só para o dono)' }
        version: { type: string, readOnly: true }
    DevicePatch:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        idle_min: { type: integer, minimum: 1, maximum: 120 }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        location: { type: string, maxLength: 60 }
        role: { $ref: '#/components/schemas/Role' }
    DeviceApprove:
      type: object
      required: [code, kind, location, role]
      properties:
        code: { type: string, pattern: '^[A-Z0-9]{8}$' }
        name: { type: string, maxLength: 60 }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        location: { type: string, maxLength: 60 }
        role: { $ref: '#/components/schemas/Role', description: 'Perfil do aparelho (a recepção é floor)' }
        idle_min: { type: integer, minimum: 1, maximum: 120 }
    DeviceChallenge:
      type: object
      properties:
        challenge_id: { type: string, format: uuid }
        challenge: { type: string, description: 'Aleatório em base64url' }
        expires_at: { type: string, format: date-time }
    DeviceSessionOpen:
      type: object
      required: [device_id, challenge_id, signature]
      properties:
        device_id: { type: string, format: uuid }
        challenge_id: { type: string, format: uuid }
        signature: { type: string, description: 'base64url da assinatura ECDSA P-256/SHA-256 do challenge' }
        device_time: { type: string, format: date-time, description: 'A hora do aparelho (relógio errado, 1.11)' }
    DevicePerson:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string, description: 'Como aparece na tela de bloqueio' }
        role: { $ref: '#/components/schemas/Role' }
        locked_until: { type: [string, 'null'], format: date-time }
    PinLogin:
      type: object
      required: [user_id, pin]
      properties:
        user_id: { type: string, format: uuid, description: 'A pessoa que tocou o próprio nome' }
        pin: { type: string, pattern: '^\d{4}$', description: 'Últimos 4 dígitos do telefone dela' }
    PinUserCreate:
      type: object
      required: [name, role, phone]
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        role: { $ref: '#/components/schemas/Role' }
        phone: { type: string, description: 'E.164; cifrado como o do cliente (AD-23); o PIN é os últimos 4 dígitos' }

    # ---------- salão e recepção (AD-27, AD-28, AD-32)
    FloorCommand:
      type: object
      properties:
        occurred_at: { type: string, format: date-time, description: 'Hora do aparelho. O servidor grava e decide pela própria hora; em release aceita até 6 h no passado e na mesma noite (AD-28)' }
        from_paper: { type: boolean, description: 'Lançado do papel depois (6.13)' }
        correction_reason: { type: string, maxLength: 280, description: 'Mudança numa noite já fechada: o motivo vai ao registro (6.14); sem ele, 409 conflict, reason correction_reason_required' }
    TableSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        venue_id: { type: string, format: uuid, description: 'A casa, desde já (base do módulo 3)' }
        reservation_id: { type: string, format: uuid, description: 'Reserva de origem (toda sessão nasce de check_in)' }
        status: { $ref: '#/components/schemas/TableSessionStatus' }
        table_codes: { type: array, items: { type: string, example: S1 }, description: 'Vazio quando a sessão está numa área em modo lista' }
        area_code: { oneOf: [{ $ref: '#/components/schemas/AreaKey' }, { type: 'null' }], description: 'Área em modo lista (balcão, lista de evento), sem mesa' }
        people: { type: integer, minimum: 1 }
        seated_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time, description: 'Fim previsto pelo tempo de mesa; vazio = livre' }
        extended_min: { type: integer, description: 'Minutos somados por +10' }
        release_hint: { type: boolean, description: 'Marcada "para liberar" (grupo floor)' }
        released_at: { type: [string, 'null'], format: date-time }
        merged_into: { type: [string, 'null'], format: uuid }
        duration_min: { type: [integer, 'null'], description: 'Minutos de mesa até agora' }
        version: { type: string, readOnly: true }
    TableSessionEvent:
      type: object
      properties:
        at: { type: string, format: date-time }
        occurred_at: { type: [string, 'null'], format: date-time, description: 'Hora do aparelho, quando veio' }
        kind: { $ref: '#/components/schemas/TableSessionEventKind' }
        actor_label: { type: string }
        device_id: { type: [string, 'null'], format: uuid }
        device_label: { type: [string, 'null'] }
        table_codes: { type: array, items: { type: string } }
        people: { type: [integer, 'null'] }
    TableSessionDetail:
      allOf:
        - $ref: '#/components/schemas/TableSession'
        - type: object
          properties:
            reservation: { $ref: '#/components/schemas/ReservationStaff' }
            events: { type: array, items: { $ref: '#/components/schemas/TableSessionEvent' } }
    MessageQueued:
      type: object
      properties:
        message_id: { type: string, format: uuid }
        template: { $ref: '#/components/schemas/ReadyMessageTemplate' }
        status: { $ref: '#/components/schemas/MessageStatus' }
        sent_at: { type: string, format: date-time }
    NightSnapshot:
      type: object
      description: 'Sem dado de saúde; telefone sempre mascarado (AD-32)'
      properties:
        server_time: { type: string, format: date-time, description: 'A hora da leitura; a faixa "Sem conexão · leitura de HH:MM" usa ela' }
        date: { type: string, format: date }
        day: { $ref: '#/components/schemas/ResolvedDay' }
        reservations: { type: array, items: { $ref: '#/components/schemas/ReservationStaff' } }
        waitlist: { type: array, items: { $ref: '#/components/schemas/ReservationStaff' } }
        sessions: { type: array, items: { $ref: '#/components/schemas/TableSession' } }
        areas: { type: array, items: { type: object, properties: { key: { $ref: '#/components/schemas/AreaKey' }, name: { type: string } } } }
        purge_before: { type: string, format: date, description: 'O aparelho apaga retratos de noites anteriores a esta' }
        sheet_printed_at: { type: [string, 'null'], format: date-time }
        changes: { type: array, items: {}, description: 'Com since: o que mudou depois (a folha curta, 6.10)' }
    StreamInvalidate:
      type: object
      description: 'data do evento SSE `invalidate` (AD-27): só a dica; a tela refaz o GET'
      required: [entity, id, version]
      properties:
        entity: { $ref: '#/components/schemas/StreamEntity' }
        id: { type: string, description: 'uuid da entidade, ou a data (YYYY-MM-DD) para day_plan e waitlist' }
        version: { type: string }

    # ---------- público: consentimento e medição
    ConsentInput:
      type: object
      required: [banner_version, measurement]
      properties:
        consent_id: { type: string, format: uuid, description: 'Aleatório do navegador, sem ligação com pessoa' }
        banner_version: { type: string }
        remember: { type: boolean, description: 'Lembrar de mim: nome, WhatsApp e tamanho do grupo guardados só no aparelho' }
        measurement: { type: boolean, description: 'Necessários são sempre ligados' }
        categories: { type: object, description: 'A mesma escolha por categoria', properties: { necessary: { type: boolean }, remember: { type: boolean }, measurement: { type: boolean } } }
        locale: { $ref: '#/components/schemas/Locale' }
    MeasureEventName:
      type: string
      enum: [page_view, menu_tab, book_party, book_day, book_time, book_details, book_code_sent, book_done, book_error, click_whatsapp, click_maps, click_waze, theme_change]
    MeasureInput:
      type: object
      required: [visitor, visit, events]
      properties:
        visitor: { type: string, format: uuid, description: 'Cookie trt_vis: aleatório, 12 meses' }
        visit: { type: string, format: uuid, description: 'Cookie trt_visita: aleatório, 30 minutos parado' }
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [name, at, page]
            properties:
              name: { $ref: '#/components/schemas/MeasureEventName' }
              at: { type: string, format: date-time }
              page: { type: string, maxLength: 80, example: /reservar/ }
              locale: { $ref: '#/components/schemas/Locale' }
              data:
                type: object
                maxProperties: 8
                description: 'Valores pequenos: número, booleano ou código ^[\w:./+-]{0,40}$ (ex.: party 4, weekday 5, time 20:30, origin bio, theme escuro). Nunca nome, telefone ou texto digitado.'
                additionalProperties: { type: [number, boolean, string] }
    VitalsInput:
      type: object
      required: [page, metrics]
      properties:
        page: { type: string, description: 'Caminho sem query, ex.: /cardapio', example: / }
        locale: { $ref: '#/components/schemas/Locale' }
        connection: { type: [string, 'null'], example: 4g }
        metrics:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required: [name, value]
            properties:
              name: { $ref: '#/components/schemas/WebVitalName' }
              value: { type: number, description: 'ms; CLS sem unidade' }
              rating: { $ref: '#/components/schemas/WebVitalRating' }

    # ---------- base
    SiteBuild:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/SiteBuildStatus' }
        reason: { type: string, example: 'menu:publish' }
        requested_by: { type: [string, 'null'] }
        requested_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
        label: { type: [string, 'null'], description: 'O que pediu a publicação, em palavras' }
    PrivacyRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: [string, 'null'], format: uuid }
        customer_label: { type: string, description: 'Primeiro nome e telefone mascarado' }
        kind: { $ref: '#/components/schemas/PrivacyRequestKind' }
        channel: { $ref: '#/components/schemas/PrivacyRequestChannel' }
        status: { $ref: '#/components/schemas/PrivacyRequestStatus' }
        opened_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time, description: '15 dias depois de aberto' }
        resolved_at: { type: [string, 'null'], format: date-time }
        resolved_by: { type: [string, 'null'] }
        note: { type: string }
    PrivacyRequestInput:
      type: object
      required: [customer_id, kind, channel]
      properties:
        customer_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/PrivacyRequestKind' }
        channel: { $ref: '#/components/schemas/PrivacyRequestChannel' }
        note: { type: string, maxLength: 500 }
    PrivacyRequestResolve:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/PrivacyRequestStatus' }
        note: { type: string, maxLength: 500, description: 'Obrigatório ao recusar' }
    PrivacyRequestPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/PrivacyRequest' } }
    StaffTableOption:
      type: object
      properties:
        table_codes: { type: array, items: { type: string } }
        area_key: { $ref: '#/components/schemas/AreaKey' }
        seats: { type: integer }
        held: { type: boolean, description: 'Mesa guardada para quem chega sem reserva' }
        label: { type: string }
        over_limit: { type: boolean, description: 'Passa do limite da noite (5.7)' }
    TokenInfo:
      type: object
      properties:
        kind: { type: string, enum: [owner_setup, invite, reset] }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        invited_by: { type: [string, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
        valid: { type: boolean, description: 'Falso quando venceu ou já foi usado' }
        name: { type: string }
        recovery: { type: boolean, description: 'Link de recuperação do dono (perdeu o aplicativo)' }
    ExportRequest:
      type: object
      description: 'Os filtros da tela. A identidade vem da confirmação recente (POST /staff/auth/reauth), não do corpo.'
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        status: { type: array, items: { $ref: '#/components/schemas/ReservationStatus' } }
        source: { $ref: '#/components/schemas/ReservationSource' }
        q: { type: string }
        actor: { type: string }
        action: { type: string }
        device: { type: string }
        password: { type: string, deprecated: true, description: 'Antigo: a senha ia no corpo' }
        code: { type: string, deprecated: true }
    Onboarding:
      type: object
      properties:
        done: { type: boolean }
        current_step: { oneOf: [{ $ref: '#/components/schemas/OnboardingStepKey' }, { type: 'null' }] }
        steps:
          type: array
          items:
            type: object
            properties:
              key: { $ref: '#/components/schemas/OnboardingStepKey' }
              done: { type: boolean, description: 'Calculado pelo servidor a partir dos dados' }
              skipped: { type: boolean }
              missing: { type: array, items: { type: string } }
        dismissed: { type: boolean }
        version: { type: string, readOnly: true }
    OnboardingInput:
      type: object
      properties:
        current_step: { oneOf: [{ $ref: '#/components/schemas/OnboardingStepKey' }, { type: 'null' }] }
        skipped: { type: array, items: { $ref: '#/components/schemas/OnboardingStepKey' } }
        dismissed: { type: boolean, description: 'O dono fechou o assistente' }
        after_setup: { type: boolean, description: 'O dono chegou ao assistente logo depois do primeiro acesso (3.12)' }
        layouts_accepted: { type: boolean, description: 'O dono aceitou a planta estimada pelas fotos' }

    # ---------- 0.4.0: as rotas que o painel já usa
    NightClose:
      type: object
      properties:
        date: { type: string, format: date }
        closed_at: { type: [string, 'null'], format: date-time }
        closed_by: { type: [string, 'null'] }
        postponed: { type: boolean }
        outage: { type: boolean }
        no_shows: { type: array, items: { type: string, format: uuid }, description: 'As reservas marcadas "Não veio" no fechamento' }
        released: { type: integer }
        review: { type: array, items: {}, description: 'O que o dono revê no dia seguinte (6.14)' }
    NightCorrectionInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [check_in, walk_in, release, no_show, people, move], description: 'O que estava no papel' }
        date: { type: string, format: date }
        reservation_id: { type: [string, 'null'], format: uuid }
        table_codes: { type: array, items: { type: string } }
        people: { type: [integer, 'null'] }
        occurred_at: { type: string, format: date-time }
        label: { type: string, maxLength: 120 }
        note: { type: string, maxLength: 280 }
    NightCorrection:
      allOf:
        - $ref: '#/components/schemas/NightCorrectionInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [open, applied, dismissed] }
            sent_by: { type: [string, 'null'] }
            sent_at: { type: string, format: date-time }
            resolved_by: { type: [string, 'null'] }
            resolved_at: { type: [string, 'null'], format: date-time }
    MessageTemplate:
      type: object
      description: 'Um modelo de mensagem do WhatsApp e a situação dele na Meta (2.14)'
      properties:
        id: { type: string, example: reminder }
        name: { type: string, example: Lembrete do dia }
        kind: { type: string, enum: [system, ready], description: 'system = mandado pelo sistema; ready = mensagem pronta da recepção' }
        text: { $ref: '#/components/schemas/LocalizedText' }
        previous_text: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }], description: 'O texto que vale enquanto a revisão espera a Meta' }
        status: { type: string, enum: [approved, pending, rejected] }
        reason: { type: [string, 'null'], description: 'Por que a Meta recusou' }
        submitted_at: { type: [string, 'null'], format: date-time }
        approved_at: { type: [string, 'null'], format: date-time }
    SystemStatus:
      type: object
      description: 'Sistema (1.14): o que mantém a casa funcionando, sem segredo nem resposta crua'
      properties:
        checked_at: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/SystemItem' } }
        errors: { type: array, items: { $ref: '#/components/schemas/SystemError' }, description: 'Erros recentes, sem dado pessoal' }
        clock: { type: array, items: { $ref: '#/components/schemas/DeviceClock' }, description: 'A diferença de relógio de cada aparelho' }
    SystemItem:
      type: object
      properties:
        key: { type: string, enum: [whatsapp, queue, backup, restore, google, errors] }
        state: { type: string, enum: [ok, problem, not_connected, unused] }
        checked_at: { type: [string, 'null'], format: date-time }
        detail: { type: [string, 'null'] }
    SystemError:
      type: object
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        where: { type: string }
        message: { type: string, description: 'Em palavras da casa, sem dado pessoal além do primeiro nome' }
        request_id: { type: [string, 'null'] }
    DeviceClock:
      type: object
      properties:
        device_id: { type: string, format: uuid }
        clock_skew_s: { type: [integer, 'null'] }
    GoogleStatus:
      type: object
      description: 'A conta Google da casa (2.22): o que está ligado e o que vai (e nunca vai) para a Agenda e o Drive'
      properties:
        connected: { type: boolean }
        account_email: { type: [string, 'null'] }
        account_name: { type: [string, 'null'] }
        scopes: { type: array, items: { type: string, example: drive.file } }
        connected_at: { type: [string, 'null'], format: date-time }
        connected_by: { type: [string, 'null'] }
        calendar: { oneOf: [{ $ref: '#/components/schemas/GoogleCalendar' }, { type: 'null' }] }
        folder: { oneOf: [{ $ref: '#/components/schemas/GoogleFolder' }, { type: 'null' }] }
        calendar_sync: { type: boolean }
        drive_sync: { type: boolean }
        sync: { type: object, properties: { state: { type: string, enum: [ok, problem, not_connected] }, last_sync_at: { type: [string, 'null'], format: date-time }, last_change: { type: [string, 'null'] }, detail: { type: [string, 'null'] }, events_count: { type: integer }, window_days: { type: integer }, kept_events: { type: integer } } }
        sent: { type: array, items: { type: string }, description: 'O que vai para a Agenda' }
        never_sent: { type: array, items: { type: string }, description: 'O que nunca vai (telefone, restrição alimentar…)' }
        preview: { oneOf: [{ $ref: '#/components/schemas/GoogleEvent' }, { type: 'null' }], description: 'Uma reserva como evento, para o dono ver antes de ligar' }
        files: { type: array, items: { $ref: '#/components/schemas/GoogleFile' }, description: 'Os últimos arquivos mandados ao Drive' }
    GoogleUpdate:
      type: object
      properties:
        account_email: { type: string, description: 'Na volta da autorização do Google' }
        account_name: { type: string }
        scopes: { type: array, items: { type: string } }
        calendar: { type: object, description: '{ id } de uma agenda que a conta já tem, ou { create, name }', properties: { id: { type: string }, create: { type: boolean }, name: { type: string } } }
        folder: { type: object, description: '{ id } de uma pasta, ou { create, name }', properties: { id: { type: string }, create: { type: boolean }, name: { type: string } } }
        calendar_sync: { type: boolean }
        drive_sync: { type: boolean }
        delete_events: { type: boolean, description: 'Ao desligar a Agenda: apagar os eventos já criados' }
    GoogleCalendar:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        primary: { type: boolean }
        created: { type: boolean }
    GoogleFolder:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created: { type: boolean }
    GoogleFile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        night: { type: [string, 'null'], format: date }
        kind: { type: string, enum: [night_sheet, export] }
        created_at: { type: string, format: date-time }
        folder: { type: string }
    GoogleEvent:
      type: object
      description: 'Uma reserva como evento da Agenda: só primeiro nome, pessoas, mesa, código e o link do painel'
      properties:
        id: { type: string }
        reservation_id: { type: string, format: uuid }
        title: { type: string }
        first_name: { type: string }
        party_size: { type: integer }
        table: { type: [string, 'null'] }
        code: { type: string }
        link: { type: string }
        status: { type: string, enum: [confirmed, tentative] }
        date: { type: string, format: date }
        time: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        description: { type: string }
    SiteStats:
      type: object
      description: 'Números do site da semana (10.16); example = verdadeiro enquanto o contador não está no ar'
      properties:
        example: { type: boolean }
        period: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
        visits: { type: integer }
        visits_before: { type: integer }
        visitors: { type: integer }
        reservations: { type: integer }
        reservations_before: { type: integer }
        menu_views: { type: integer }
        days: { type: array, items: { type: object, properties: { date: { type: string, format: date }, visits: { type: integer }, reservations: { type: integer } } } }
        pages: { type: array, items: { type: object, properties: { path: { type: string }, label: { type: string }, views: { type: integer } } } }
        languages: { type: array, items: { type: object, properties: { lang: { $ref: '#/components/schemas/Locale' }, share: { type: number } } } }
        sources: { type: array, items: { type: object, properties: { source: { type: string }, share: { type: number } } } }
    Permissions:
      type: object
      description: 'Permissões por área (1.15, FR-82). defaults vem de permissoes.yaml; allowed é o que o dono escolheu'
      properties:
        areas: { type: array, items: { type: string }, description: 'As 15 áreas do trilho' }
        defaults: { type: object, properties: { manager: { type: array, items: { type: string } }, floor: { type: array, items: { type: string } } } }
        allowed: { type: object, properties: { manager: { type: array, items: { type: string } }, floor: { type: array, items: { type: string } } } }
        owner: { type: array, items: { type: string }, description: 'O dono sempre tem todas' }
        updated_at: { type: [string, 'null'], format: date-time }
        updated_by: { type: [string, 'null'] }
    PermissionsInput:
      type: object
      properties:
        allowed: { type: object, properties: { manager: { type: array, items: { type: string } }, floor: { type: array, items: { type: string } } } }
        reset: { type: boolean, description: 'Voltar ao padrão' }
        password: { type: string, deprecated: true, description: 'Antigo; vale a confirmação de identidade recente' }
