openapi: 3.1.0
info:
  title: Território API
  version: 0.6.0
  description: |
    Contrato da API do site e do sistema de reservas do Território.
    Versão 0 (fase 0): cobre todas as telas do mapa. Congela como v1 depois da validação do front (fase 7).

    Convenções:
    - Front e API no mesmo domínio; a API fica em `/api/v1`.
    - Dia e horário de reserva no fuso da casa (`America/Sao_Paulo`): `date` = YYYY-MM-DD, `time` = HH:MM.
    - Instantes em UTC, ISO 8601. Dinheiro em centavos.
    - Erros em problem+json (RFC 9457), com `type` do enum `ProblemType` e `errors[]` por campo.
    - Sessões em cookie `httpOnly`. Toda requisição que muda dado envia `X-CSRF-Token`.
    - Respostas que dependem de hora trazem `server_time`.
    - Três tipos de sessão (AD-9): pessoal da equipe (`staffSession`), de aparelho da casa com pessoa ativa por PIN (`deviceSession` + `deviceSignature`, AD-26) e de cliente (`customerSession`). As rotas da recepção aceitam a pessoal ou a do aparelho.
    - Enums definidos uma vez em `components/schemas` e referenciados por `$ref` (AD-2).
    - Texto editável que aparece ao público usa `LocalizedText` {pt, es, en}; língua vazia cai no `pt` (AD-35).

    0.2.0 (14/10/2026), para o PRD de 14/10 e o spine de arquitetura:
    - `ReservationAction`: saem `arrived` e `seated`; entram `check_in`, `undo_check_in`, `undo_no_show` e `forgive_no_show` (AD-4, emenda de 14/10). `check_in`, `undo_check_in` e `release` aceitam `occurred_at` (AD-28).
    - Configurações por grupo (AD-29): enum `SettingsGroup`, `GET /staff/settings` vira índice, `GET`/`PATCH /staff/settings/{group}` com `If-Match` e `POST /staff/settings/{group}/preview` no lugar do `?dry_run`. Um schema por grupo.
    - Aparelhos da casa e PIN (AD-26): pareamento, aprovação, sessão por desafio assinado, PIN = últimos 4 dígitos do telefone da pessoa, escolhendo o nome na tela.
    - Sessão de mesa (AD-28): `TableSession` no salão, com trocar, juntar, separar, liberar e +10 min.
    - Recepção: mensagens prontas, retrato da noite (AD-32) e `GET /staff/stream` por SSE (AD-27).
    - Conta do cliente (AD-30): Google, perfil, troca de telefone e reserva própria em `/reservations/mine/{code}` (sai o `PATCH /reservations/{code}`).
    - Público: combinados, consentimento de cookies, medidas de desempenho e eventos.
    - Base: progresso do primeiro uso, reenviar convite, pessoa só de PIN, publicações do site e pedidos do titular (LGPD).
    - Webhook do WhatsApp em `/webhooks/whatsapp` (AD-12); sai `/internal/whatsapp/replies` e o `internalSignature`.
    - `LocalizedText`, `Locale` e `locale` na reserva e no cliente (AD-35); `phone_verified` na reserva da equipe (AD-22).
    - `ProblemType` vira enum (AD-10), com `plan_changed`, `device_not_approved`, `pin_locked`, `turnstile_failed` e outros.
    - Turnstile (`turnstile_token`) no código, na criação de reserva e espera e no login da equipe (AD-14).

    0.4.0 (16/10/2026), o contrato no nível do que o front e a simulação usam (histórias 1.3 e 1.4):
    - Respostas comuns, sem repetir em cada rota: qualquer operação pode responder 429 `rate_limited`, 500 `server` e 503 `unavailable`; as que têm `security` também 401 (`unauthorized`, `session_expired`, `device_signature_invalid`) e 403 (`forbidden`, `csrf_failed`, `reauth_required`, `no_active_person`, `device_not_approved`, `account_disabled`); as que têm parâmetro no caminho, 404 `not_found`; as que leem `If-Match`, 412 `precondition_failed` (com `current`) e 428 sem a versão. Tudo em problem+json (`Problem`).
    - Permissões: cada operação da equipe está em `docs/api/permissoes.yaml` (papéis padrão, área e se é sensível). As sensíveis (FR-74) são do dono (ver o telefone completo também do gerente, a decidir entre 5.16 e 1.15) e pedem a confirmação de identidade dos últimos 5 minutos (`POST /staff/auth/reauth`); sem ela, 403 `reauth_required`, nunca 401. Uma área que o dono tirou do perfil (FR-82) responde 403 `forbidden`; operação fora do arquivo também (na dúvida, negado).
    - `If-Match` é cabeçalho em toda gravação com versão (sai o `?if_match=`); o front manda a `version` (ou o `etag` do bloco do site) que leu.
    - Rotas novas: confirmação de identidade, zerar a verificação em duas etapas, permissões por área, situação do sistema e "Testar agora", modelos de mensagem e revisões, publicar o site de novo e números do site, Google (Agenda e Drive), áreas da casa (criar e apagar), ordem do cardápio, evento por id, tirar convidado da lista, espera da porta e "mesa pronta", dispensar alerta do Hoje, reabrir sessão de mesa e a vida da noite (folha impressa, adiar e fechar a noite, anotações do papel).
    - `AreaKey` vira texto aberto (a casa cria áreas); áreas, plantas e mesas com medidas em metros (`width_m`, `depth_m`), modo padrão e lista padrão.
    - Campos que a demonstração já usa: relógio e regras da noite, prazos de desfazer, resposta da ligação e "sem WhatsApp", situação da oferta, alertas com id e caminho, primeiro uso, retrato da noite com mudanças, e o resto listado nos schemas.
    - Cookie do aparelho da casa: `__Host-trt_aparelho` (registro de cookies, AD-37).
    - "Vou atrasar" (`answer: late` em `POST /links/{token}/confirm` e `POST /reservations/mine/{code}/late`): o extra se aplica uma vez por reserva; avisar de novo, ou depois da resposta da ligação, não aplica outra vez (409 `invalid_transition`, reason `late`).

    0.5.0 (16/10/2026), a central de avisos da equipe (FR-87, mudança de 16/10, `territorio/docs/planejamento/mudanca-avisos-2026-10-16.md`):
    - Os avisos à equipe saem só pelo painel. Rotas novas: `GET /staff/alerts` (a lista da pessoa, com lido, dispensado, resolvido, silêncio e contagem do sino), `POST /staff/alerts/read`, `POST /staff/alerts/{id}/dismiss` (só para mim, só informativo), `POST /staff/alerts/{id}/resolve` (para todos, só o que não some sozinho; nunca crítico) e `GET`/`PUT /staff/me/alert-preferences` ("Meus avisos"; crítico não desliga). `/staff/notifications` continua sendo só dos modelos do WhatsApp.
    - Sai `POST /staff/dashboard/alerts/{id}/dismiss`: o Hoje e a central leem a mesma lista e usam as rotas acima.
    - `StaffAlertKind` é o catálogo único dos avisos guardados pela casa (`src/admin/avisos/catalogo.js`); `night_outage` vira `outage_review`. `StaffAlert` ganha `level`, `title`, o estado da pessoa (`read_at`, `dismissed_at`, `muted`, `silenced`) e o da casa (`resolved_at`, `resolved_by`), `can_dismiss` e `can_resolve`.
    - `SettingsAlerts` perde `channels` (sem WhatsApp e sem e-mail para a equipe); `pending_to` e `late_request_to` nascem com dono e gerente.
    - O fluxo ao vivo avisa a central pela entidade `alert`.

    0.6.0 (16/10/2026), o que a segunda checagem deixou aberto nos épicos 1 a 7:
    - Rota nova `GET /staff/customers/language`: só a língua guardada do cliente, para a nova reserva pela equipe sugerir a língua certa (5.6).
    - `FloorState.holds[]`: mesas presas por pedido pendente ou oferta da espera aparecem "reservada" no Salão, nunca "livre" (6.1).
    - `ready_messages` aceita no máximo 3 (as da casa, 2.14); `unpriced_item` e `show_sold_out` passam para `SettingsMenu` (2.17).
    - Permissões (`permissoes.yaml`): as ações de cada papel ficam escritas por ação, e `settings.update` vira `settings.write`.
    - `IntegrationKey`: `analytics` e `monitoring` passam a `measurement` e `monitor`, como na história 2.20.
servers:
  - url: /api/v1

tags:
  - name: Público
  - name: Cliente
  - name: Links
  - name: Equipe · acesso
  - name: Equipe · operação
  - name: Equipe · casa
  - name: Equipe · conteúdo
  - name: Equipe · administração
  - name: Webhooks

paths:
  # ---------------------------------------------------------------- público
  /house:
    get:
      tags: [Público]
      summary: Dados públicos da casa, horários, regras de reserva e combinados vigentes
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/HousePublic' } } } }

  /menu:
    get:
      tags: [Público]
      summary: Cardápio publicado, com disponibilidade de hoje
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Menu' } } } }

  /content:
    get:
      tags: [Público]
      summary: Blocos de conteúdo publicados, aviso de hoje e próximos eventos
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ContentPublic' } } } }

  /availability/days:
    get:
      tags: [Público]
      summary: Situação de cada dia para um tamanho de grupo
      parameters:
        - { name: from, in: query, description: 'Vazio = hoje no fuso da casa', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'Vazio = 13 dias depois de from; no máximo 62 dias', schema: { type: string, format: date } }
        - $ref: '#/components/parameters/PartySize'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/DaysResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /availability/slots:
    get:
      tags: [Público]
      summary: Horários de um dia para um tamanho de grupo
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/PartySize'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/SlotsResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /terms:
    get:
      tags: [Público]
      summary: Combinados vigentes e a versão que a reserva vai guardar
      description: 'Os números (tolerância, prazo, tempo de mesa) já vêm preenchidos pela configuração. A reserva manda a mesma version em terms_version; versão velha volta 409 terms_outdated.'
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Terms' } } } }

  /events:
    get:
      tags: [Público]
      summary: Próximos eventos publicados e as edições passadas com foto
      parameters:
        - $ref: '#/components/parameters/Lang'
        - { name: past, in: query, description: 'Verdadeiro traz só as edições passadas', schema: { type: boolean } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/EventPublicPage' } } } }

  /events/{slug}:
    get:
      tags: [Público]
      summary: Página de um evento publicado
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, example: forro-no-quintal-2026-10-24 } }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/EventPublic' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /consents:
    post:
      tags: [Público]
      summary: Guardar a escolha do banner de cookies (sem dado pessoal)
      description: 'Sem sessão e sem CSRF (lista NO_SESSION, AD-26), com limite de taxa por IP. Guarda só a escolha, a versão do banner e um id aleatório do navegador; nada de IP nem usuário.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConsentInput' } } }
      responses:
        '204': { description: 'Gravado' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /measure:
    post:
      tags: [Público]
      summary: Eventos de medição do site, só com o consentimento de medição (FR-68)
      description: 'Sem sessão e sem CSRF (lista NO_SESSION), com limite por IP. Primeira parte: nada vai a terceiros. Sem nome, telefone nem texto livre: os valores de data são números, booleanos ou códigos curtos (o servidor recusa o resto). visitor e visit são aleatórios (cookies trt_vis e trt_visita). Registros por visita guardados 12 meses; depois, só os totais. O servidor pode repassar ao Umami da própria VM.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeasureInput' } } }
      responses:
        '202': { description: 'Recebido' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /vitals:
    post:
      tags: [Público]
      summary: Medidas de desempenho anônimas da página (LCP, CLS, INP), FR-81
      description: 'Sem sessão e sem CSRF (lista NO_SESSION), com limite por IP. Sem dado pessoal; guardadas 90 dias para agregar.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VitalsInput' } } }
      responses:
        '202': { description: 'Recebido' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- cliente
  /auth/otp:
    post:
      tags: [Cliente]
      summary: Envia um código de 6 dígitos pelo WhatsApp
      description: 'Limite de 3 envios por hora por número e por IP. Só DDIs +55, +595 e +54. Exige turnstile_token (400 turnstile_failed). Também manda o código para o número novo antes de POST /me/phone.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OtpRequest' } } }
      responses:
        '202': { description: 'Código enviado', content: { application/json: { schema: { $ref: '#/components/schemas/OtpSent' } } } }
        '400': { description: 'Turnstile recusado', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/verify:
    post:
      tags: [Cliente]
      summary: Confere o código e abre a sessão do cliente
      description: 5 tentativas por código; o código vale 10 minutos. Define o cookie de sessão do cliente.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OtpVerify' } } }
      responses:
        '200': { description: 'Sessão aberta', content: { application/json: { schema: { $ref: '#/components/schemas/CustomerSession' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Cliente]
      summary: Encerra a sessão do cliente
      security: [{ customerSession: [], csrf: [] }]
      responses:
        '204': { description: 'Sessão encerrada' }

  /auth/google/start:
    get:
      tags: [Cliente]
      summary: Começa o login com o Google (OpenID Connect pelo servidor, com PKCE e state)
      description: 'Navegação de página, não chamada de fetch: responde 302 para o Google. Sem SDK do Google no front (AD-30).'
      parameters:
        - { name: return_to, in: query, description: 'Caminho do site para voltar (só caminhos do próprio domínio)', schema: { type: string, example: /minhas-reservas } }
      responses:
        '302': { description: 'Redireciona para o Google', headers: { Location: { schema: { type: string } } } }

  /auth/google/callback:
    get:
      tags: [Cliente]
      summary: Volta do Google; confere o id_token, liga a identidade ao telefone e abre a sessão do cliente
      description: 'Responde 302 para return_to. Conta nova pelo Google volta com ?needs_phone=1 e só reserva depois de verificar um telefone (POST /auth/otp e POST /me/phone). Erro volta com ?auth_error=<ProblemType>.'
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: return_to, in: query, description: 'Só na demonstração: o caminho de volta, que o servidor real guarda no state', schema: { type: string } }
      responses:
        '302': { description: 'Sessão aberta (ou erro) e volta ao site', headers: { Location: { schema: { type: string } } } }
        '200': { description: 'Só na demonstração (sem Google de verdade): o endereço de volta em JSON, no lugar do 302. Ele leva ?needs_phone=1 (conta nova sem telefone verificado) ou ?auth_error=<ProblemType>', content: { application/json: { schema: { type: object, properties: { location: { type: string, example: '/minhas-reservas/?needs_phone=1' }, needs_phone: { type: boolean }, auth_error: { type: [string, 'null'] } } } } } }

  /me:
    get:
      tags: [Cliente]
      summary: Dados do cliente logado e o token CSRF da sessão
      description: 'O site tem várias páginas e o token não sobrevive à troca de página: cada página que muda dado chama /me ao abrir e guarda o csrf_token.'
      security: [{ customerSession: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/CustomerMe' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Cliente]
      summary: Atualizar nome, e-mail, língua das mensagens e novidades
      security: [{ customerSession: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerMePatch' } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/CustomerMe' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Cliente]
      summary: Pede para apagar os dados pessoais (LGPD)
      description: 'Abre um pedido do titular (privacy_requests) e anonimiza: as reservas futuras são canceladas pelo comando cancel, com a mensagem de cancelamento (AD-11). Resposta em até 15 dias; aqui é imediato.'
      security: [{ customerSession: [], csrf: [] }]
      responses:
        '202': { description: 'Pedido registrado: o prazo e quantas reservas futuras foram canceladas', content: { application/json: { schema: { type: object, properties: { due_at: { type: string, format: date-time }, canceled: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/data:
    get:
      tags: [Cliente]
      summary: Baixar meus dados (LGPD)
      security: [{ customerSession: [] }]
      responses:
        '200': { description: 'Arquivo JSON com os dados do cliente: perfil, consentimentos e reservas (reservations, cada uma com terms_version e terms_locale, a língua dos combinados aceitos)', content: { application/json: { schema: { type: object, properties: { house: { type: string }, exported_at: { type: string, format: date-time }, profile: { type: object, additionalProperties: true, description: 'Nome, telefone, e-mail, língua' }, consents: { type: array, items: { type: object, additionalProperties: true } }, reservations: { type: array, items: { type: object, additionalProperties: true, properties: { terms_version: { type: [string, 'null'] }, terms_locale: { oneOf: [{ $ref: '#/components/schemas/Locale' }, { type: 'null' }] } } } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/phone:
    post:
      tags: [Cliente]
      summary: Trocar o telefone da conta (ou ligar o primeiro, numa conta nova pelo Google)
      description: 'O código vem antes por POST /auth/otp para o número novo. O número novo passa a ser a identidade (AD-22); se ele já for de outro cliente verificado, volta 409 conflict e a casa resolve.'
      security: [{ customerSession: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PhoneChange' } } }
      responses:
        '200': { description: 'Telefone trocado', content: { application/json: { schema: { $ref: '#/components/schemas/CustomerMe' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { description: 'O código venceu ou as tentativas acabaram (gone, reason otp)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /reservations:
    post:
      tags: [Cliente]
      summary: Cria uma reserva, um pedido de reserva ou uma entrada na lista de espera
      description: 'Exige turnstile_token (400 turnstile_failed) e terms_version igual à de GET /terms (409 terms_outdated). A reserva guarda locale e a mensagem sai nessa língua (AD-35).'
      security: [{ customerSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReservationCreate' } } }
      responses:
        '201': { description: 'Criada', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationPublic' } } } }
        '400': { description: 'Turnstile recusado', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Horário lotou enquanto a pessoa preenchia, ou reserva repetida
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ReservationConflict' } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /reservations/mine:
    get:
      tags: [Cliente]
      summary: Reservas do cliente logado (próximas e passadas)
      security: [{ customerSession: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { server_time: { type: string, format: date-time }, upcoming: { type: array, items: { $ref: '#/components/schemas/ReservationPublic' } }, past: { type: array, items: { $ref: '#/components/schemas/ReservationPublic' } }, window_until: { type: string, format: date, description: 'Até quando dá para remarcar (a janela de reserva)' }, items: { type: array, items: { $ref: '#/components/schemas/ReservationPublic' }, deprecated: true } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reservations/mine/{code}:
    get:
      tags: [Cliente]
      summary: Uma reserva do cliente logado
      description: 'Só reservas ligadas ao telefone verificado da conta; reserva da equipe com telefone não verificado não aparece (AD-22).'
      security: [{ customerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ReservationCode'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationPublic' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations/mine/{code}/reschedule:
    post:
      tags: [Cliente]
      summary: Remarcar ou mudar o número de pessoas da própria reserva, até o prazo
      description: 'Passa pelo comando reschedule (AD-4). Fora do prazo ou com a casa desligando a remarcação pela conta volta 409; sem vaga, 409 slot_full com alternativas.'
      security: [{ customerSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/ReservationCode'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReservationReschedule' } } }
      responses:
        '200': { description: 'Remarcada', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationPublic' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Fora do prazo, sem vaga ou transição inválida', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ReservationConflict' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reservations/mine/{code}/late:
    post:
      tags: [Cliente]
      summary: 'Avisar que vai atrasar um pouco (o mesmo "Vou atrasar" do lembrete)'
      description: 'Só com late_notice_enabled e antes do fim da tolerância. O extra_tolerance_min se aplica uma vez por reserva e a recepção é avisada; avisar de novo (por aqui, pelo link ou pela resposta da ligação) não aplica outra vez: 409 invalid_transition (reason late). Depois do novo limite vale after_tolerance (padrão: a mesa deixa de ser prioridade).'
      security: [{ customerSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/ReservationCode'
      responses:
        '200': { description: 'Aviso registrado', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationPublic' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /reservations/mine/{code}/cancel:
    post:
      tags: [Cliente]
      summary: Cancelar a própria reserva pela conta
      description: 'Depois do prazo, só se a casa deixa (grupo booking); conta como "em cima da hora". Senão volta 409 e o cliente fala com a casa.'
      security: [{ customerSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/ReservationCode'
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 280 } } } } }
      responses:
        '200': { description: 'Cancelada', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationPublic' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- links (sem login)
  /links/{token}:
    get:
      tags: [Links]
      summary: O que um link enviado ao cliente mostra (comprovante, confirmar presença, oferta da espera)
      description: 'Só leitura: abrir o link nunca muda nada. O link de leitura (view_token, o do comprovante compartilhado) só mostra; o de ação (action_token, das mensagens) também responde, cancela e aceita ou recusa a oferta (can_act).'
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/LinkView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: 'Link vencido', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /links/{token}/confirm:
    post:
      tags: [Links]
      summary: 'Responder o lembrete pela página: Confirmo, Não vou mais ou Vou atrasar um pouco'
      description: 'Alternativa aos botões do WhatsApp. A resposta pode ser trocada até o horário; late aplica o extra_tolerance_min uma vez por reserva (um segundo late, ou late depois da resposta da ligação, não aplica outra vez: 409 invalid_transition, reason late).'
      parameters:
        - $ref: '#/components/parameters/Token'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [answer], properties: { answer: { type: string, enum: ['yes', 'no', late] } } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/LinkView' } } } }
        '403': { description: 'Link de leitura não responde', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { description: 'Link vencido', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /links/{token}/accept-offer:
    post:
      tags: [Links]
      summary: Aceitar a mesa oferecida pela lista de espera
      parameters:
        - $ref: '#/components/parameters/Token'
      requestBody:
        content: { application/json: { schema: { type: object, properties: { swap_code: { type: string, description: 'A reserva da mesma noite que a pessoa aceita trocar pela mesa oferecida (FR-46)' } } } } }
      responses:
        '200': { description: 'Mesa confirmada', content: { application/json: { schema: { $ref: '#/components/schemas/LinkView' } } } }
        '409': { description: 'Oferta vencida ou já aceita', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '410': { description: 'Link vencido', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /links/{token}/decline-offer:
    post:
      tags: [Links]
      summary: 'Recusar a mesa oferecida (Não vou conseguir); a oferta passa ao próximo na hora'
      parameters:
        - $ref: '#/components/parameters/Token'
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { description: 'Recusada', content: { application/json: { schema: { $ref: '#/components/schemas/LinkView' } } } }
        '403': { description: 'Link de leitura não age', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '410': { description: 'Link vencido', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /links/{token}/cancel:
    post:
      tags: [Links]
      summary: Cancelar a reserva pelo link de ação, dentro do prazo
      parameters:
        - $ref: '#/components/parameters/Token'
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 280 } } } } }
      responses:
        '200': { description: 'Cancelada', content: { application/json: { schema: { $ref: '#/components/schemas/LinkView' } } } }
        '403': { description: 'Link de leitura não cancela', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'Fora do prazo de cancelamento; falar com a casa', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '410': { description: 'Link vencido', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /links/{token}/calendar:
    get:
      tags: [Links]
      summary: Arquivo de agenda (.ics) da reserva, FR-23
      description: 'Funciona com o link de leitura e com o de ação; só leitura.'
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200': { description: 'Evento de agenda', content: { text/calendar: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: 'Link vencido', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ---------------------------------------------------------------- webhooks
  /webhooks/whatsapp:
    get:
      tags: [Webhooks]
      summary: Verificação do webhook pela Meta (hub.verify_token)
      parameters:
        - { name: hub.mode, in: query, required: true, schema: { type: string, example: subscribe } }
        - { name: hub.verify_token, in: query, required: true, schema: { type: string } }
        - { name: hub.challenge, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Devolve o hub.challenge', content: { text/plain: { schema: { type: string } } } }
        '403': { description: 'Token de verificação não confere' }
    post:
      tags: [Webhooks]
      summary: 'Eventos da Meta: respostas aos botões do lembrete e status das mensagens (AD-12)'
      description: 'Confere X-Hub-Signature-256 sobre os bytes crus antes de ler o JSON. O evento cru vai para inbound_events (único pelo id da mensagem) e a resposta é 200. O botão leva <ref>:<answer>; a reserva é achada só pela ref da outbox e pelo context.id, nunca pelo telefone, e vai ao domínio como answer_reminder. Status (sent, delivered, read, failed) só atualizam a outbox.'
      security: [{ metaSignature: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, description: 'Corpo do webhook da Cloud API (WhatsApp Business), formato da Meta; o primeiro corpo real vira fixture' } } }
      responses:
        '200': { description: 'Recebido (também para evento repetido)' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- equipe · acesso
  /staff/auth/login:
    post:
      tags: [Equipe · acesso]
      summary: Login da equipe
      description: 'Erro sempre igual para e-mail ou senha errados. Bloqueio progressivo depois de 5 falhas. Conta desativada recebe 403 account_disabled. Dono e gerente sempre passam pelas duas etapas: a resposta 202 traz mfa_required e um challenge_id para /staff/auth/mfa. Exige turnstile_token (400 turnstile_failed). A recepção não entra por aqui: entra pelo aparelho da casa com PIN (/staff/pin/login).'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StaffLogin' } } }
      responses:
        '200': { description: 'Sessão aberta', content: { application/json: { schema: { $ref: '#/components/schemas/StaffSession' } } } }
        '202': { description: 'Falta o segundo passo', content: { application/json: { schema: { type: object, properties: { mfa_required: { type: boolean }, challenge_id: { type: string } } } } } }
        '400': { description: 'Turnstile recusado', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Conta desativada', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /staff/auth/mfa:
    post:
      tags: [Equipe · acesso]
      summary: Segundo passo do login, para quem tem duas etapas ligadas
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [challenge_id], properties: { challenge_id: { type: string }, code: { type: string, pattern: '^[0-9]{6}$' }, recovery_code: { type: string, description: 'Um dos códigos de recuperação, no lugar do code; vale uma vez' } } } } }
      responses:
        '200': { description: 'Sessão aberta', content: { application/json: { schema: { $ref: '#/components/schemas/StaffSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /staff/auth/tokens/{token}:
    get:
      tags: [Equipe · acesso]
      summary: 'Conferir um link de acesso antes de preencher (convite, primeiro acesso, nova senha)'
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/TokenInfo' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /staff/auth/session:
    get:
      tags: [Equipe · acesso]
      summary: Sessão atual (usuário, papel e token CSRF)
      description: 'Na sessão de aparelho, user é a pessoa ativa (vazio na tela de bloqueio) e device vem preenchido.'
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/StaffSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /staff/auth/logout:
    post:
      tags: [Equipe · acesso]
      summary: Sair
      security: [{ staffSession: [], csrf: [] }]
      responses:
        '204': { description: 'Sessão encerrada' }

  /staff/auth/reauth:
    post:
      tags: [Equipe · acesso]
      summary: Confirmar a identidade antes de uma ação sensível (senha e código de novo)
      description: 'FR-74, AD-23. Confere a senha e o código do aplicativo; abre uma janela de 5 minutos (grupo access, reauth_valid_min) em que as operações sensíveis de permissoes.yaml passam. Sem ela, essas operações respondem 403 reauth_required (nunca 401, que encerraria a sessão).'
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password, code], properties: { password: { type: string }, code: { type: string, pattern: '^[0-9]{6}$' } } } } }
      responses:
        '204': { description: 'Identidade confirmada por 5 minutos' }
        '401': { description: 'Senha ou código não conferem, com errors[] por campo', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /staff/auth/setup:
    post:
      tags: [Equipe · acesso]
      summary: Cria a conta do dono com o link de configuração (uso único)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StaffSetup' } } }
      responses:
        '201': { description: 'Conta criada e sessão aberta', content: { application/json: { schema: { $ref: '#/components/schemas/StaffSession' } } } }
        '410': { description: 'Link vencido ou já usado', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'Link que não existe', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/auth/accept-invite:
    post:
      tags: [Equipe · acesso]
      summary: Aceitar convite da equipe
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, name, password], properties: { token: { type: string }, name: { type: string }, password: { type: string, minLength: 12 } } } } }
      responses:
        '201': { description: 'Conta criada e sessão aberta', content: { application/json: { schema: { $ref: '#/components/schemas/StaffSession' } } } }
        '410': { description: 'Convite vencido', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'Link que não existe', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/auth/forgot:
    post:
      tags: [Equipe · acesso]
      summary: Pede o link de nova senha
      description: Resposta sempre 202, exista ou não a conta.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '202': { description: 'Pedido recebido' }

  /staff/auth/reset:
    post:
      tags: [Equipe · acesso]
      summary: Define a nova senha com o link (30 minutos, uso único)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 12 } } } } }
      responses:
        '204': { description: 'Senha trocada; outras sessões encerradas' }
        '410': { description: 'Link vencido', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 'Link que não existe', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/me:
    get:
      tags: [Equipe · acesso]
      summary: Minha conta, com o papel da sessão, as áreas liberadas e o tipo de sessão
      description: 'No aparelho da casa, role é o perfil do aparelho e user a pessoa ativa. areas = as áreas que o dono liberou para o perfil (FR-82; o dono tem todas).'
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    patch:
      tags: [Equipe · acesso]
      summary: Atualizar nome
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }

  /staff/me/password:
    post:
      tags: [Equipe · acesso]
      summary: Trocar senha (pede a atual)
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [current, password], properties: { current: { type: string }, password: { type: string, minLength: 12 } } } } }
      responses:
        '204': { description: 'Senha trocada' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/me/mfa:
    post:
      tags: [Equipe · acesso]
      summary: 'Ligar as duas etapas: devolve o endereço para o aplicativo autenticador; vale depois do primeiro código'
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { code: { type: string, pattern: '^[0-9]{6}$', description: 'Primeiro código, para concluir' } } } } }
      responses:
        '200': { description: 'Endereço otpauth ou ligado (com os códigos de recuperação, mostrados uma vez)', content: { application/json: { schema: { type: object, properties: { otpauth_url: { type: string }, secret: { type: string, description: 'O mesmo segredo do endereço, para digitar à mão' }, enabled: { type: boolean }, recovery_codes: { type: array, items: { type: string } } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Equipe · acesso]
      summary: Desligar as duas etapas (pede a senha)
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } }
      responses:
        '204': { description: 'Desligado' }
        '401': { description: 'Senha não confere', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/me/sessions:
    get:
      tags: [Equipe · acesso]
      summary: Sessões abertas
      security: [{ staffSession: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Session' } } } } }

  /staff/me/sessions/{id}:
    delete:
      tags: [Equipe · acesso]
      summary: Encerrar uma sessão
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: 'Encerrada' }

  /staff/devices/pairing:
    post:
      tags: [Equipe · acesso]
      summary: O aparelho pede o pareamento com a chave pública e recebe um código de 8 caracteres
      description: 'Sem sessão (lista NO_SESSION, AD-26), com limite de taxa por IP. O aparelho gera o par ECDSA P-256 pelo WebCrypto; a chave privada não é exportável e fica no IndexedDB. O código aparece na tela do aparelho e o dono aprova em /staff/devices/{id}/approve.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PairingRequest' } } }
      responses:
        '201': { description: 'Pedido criado', content: { application/json: { schema: { $ref: '#/components/schemas/Pairing' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /staff/devices/pairing/{id}:
    get:
      tags: [Equipe · acesso]
      summary: O aparelho confere se o pareamento foi aprovado
      description: 'Sem sessão, com limite de taxa. Consulta a cada poll_after_s até approved, rejected ou expired.'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Pairing' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /staff/devices:
    get:
      tags: [Equipe · acesso]
      summary: Aparelhos da casa, aprovados e pedidos de pareamento pendentes (dono)
      security: [{ staffSession: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Device' } } } } }

  /staff/devices/{id}:
    patch:
      tags: [Equipe · acesso]
      summary: Renomear o aparelho ou mudar tipo, local e perfil (dono)
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DevicePatch' } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /staff/devices/{id}/approve:
    post:
      tags: [Equipe · acesso]
      summary: Aprovar o pareamento conferindo o código da tela do aparelho (dono, sessão pessoal)
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeviceApprove' } } }
      responses:
        '200': { description: 'Aprovado', content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '400': { description: 'Falta o código', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'Pedido vencido ou já decidido', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'Código não confere', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/devices/{id}/revoke:
    post:
      tags: [Equipe · acesso]
      summary: Revogar um aparelho (dono; confirmação de identidade recente); a sessão dele cai na hora
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 280 } } } } }
      responses:
        '200': { description: 'Revogado', content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '403': { description: 'Outro perfil (forbidden) ou confirmação de identidade vencida (reauth_required)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/devices/session/challenge:
    post:
      tags: [Equipe · acesso]
      summary: O aparelho pede um desafio para abrir a sessão
      description: 'Sem sessão, com limite de taxa. O desafio vale 60 segundos e é de uso único.'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [device_id], properties: { device_id: { type: string, format: uuid } } } } }
      responses:
        '200': { description: 'Desafio', content: { application/json: { schema: { $ref: '#/components/schemas/DeviceChallenge' } } } }
        '403': { description: 'Aparelho não aprovado ou revogado (device_not_approved)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /staff/devices/session:
    post:
      tags: [Equipe · acesso]
      summary: Abre a sessão do aparelho com o desafio assinado pela chave privada
      description: 'Define o cookie da sessão do aparelho. Daí em diante toda requisição dessa sessão leva os cabeçalhos de deviceSignature, e o servidor confere a assinatura e devices.status = approved a cada uma. A sessão abre na tela de bloqueio: sem pessoa ativa, só lê o que essa tela mostra.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeviceSessionOpen' } } }
      responses:
        '201': { description: 'Sessão do aparelho aberta', content: { application/json: { schema: { $ref: '#/components/schemas/StaffSession' } } } }
        '401': { description: 'Assinatura não confere ou desafio vencido (device_signature_invalid)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: 'Aparelho não aprovado ou revogado (device_not_approved)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/devices/staff:
    get:
      tags: [Equipe · acesso]
      summary: Pessoas que podem entrar neste aparelho (a tela de bloqueio mostra os nomes)
      security: [{ deviceSession: [], deviceSignature: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DevicePerson' } } } } }
        '403': { description: 'Aparelho não aprovado (device_not_approved)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/pin/login:
    post:
      tags: [Equipe · acesso]
      summary: 'A pessoa toca o próprio nome e digita o PIN: os últimos 4 dígitos do telefone dela'
      description: 'Só numa sessão de aparelho aprovado. Abre a pessoa ativa dentro da sessão do aparelho; ela sai por inatividade (grupo access) sem derrubar o aparelho. 5 erros travam a pessoa por 15 minutos e avisam o dono (423 pin_locked). O PIN nunca identifica a pessoa sozinho e não existe rota para criar PIN: ele vem do telefone cadastrado na equipe.'
      security: [{ deviceSession: [], deviceSignature: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PinLogin' } } }
      responses:
        '200': { description: 'Pessoa ativa', content: { application/json: { schema: { $ref: '#/components/schemas/StaffSession' } } } }
        '401': { description: 'PIN não confere (pin_invalid), com as tentativas que sobram', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: 'Aparelho não aprovado (device_not_approved)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '423': { description: 'Pessoa travada (pin_locked); Retry-After diz quando', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/pin/logout:
    post:
      tags: [Equipe · acesso]
      summary: A pessoa ativa sai; o aparelho volta para a tela de bloqueio
      security: [{ deviceSession: [], deviceSignature: [], csrf: [] }]
      responses:
        '204': { description: 'Saiu' }

  # ---------------------------------------------------------------- equipe · operação
  /staff/dashboard:
    get:
      tags: [Equipe · operação]
      summary: Hoje (a noite num olhar)
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }

  # ---------------------------------------------------------------- central de avisos (FR-87)
  /staff/alerts:
    get:
      tags: [Equipe · operação]
      summary: A central de avisos da pessoa que está no painel
      description: 'Os avisos que o catálogo (e Configurações › Avisos) dá a esta pessoa: os de pé e os resolvidos dos últimos 7 dias, com o que ela leu, dispensou ou não segue. `unread` é o número do sino: ativos não lidos, fora do silêncio e seguidos (crítico conta sempre). O Hoje lê a mesma lista. Mudanças chegam pelo fluxo ao vivo (entidade `alert`).'
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/StaffAlertList' } } } }

  /staff/alerts/read:
    post:
      tags: [Equipe · operação]
      summary: Marcar avisos como lidos (os mostrados; sem ids, todos os de pé)
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: string } } } } } }
      responses:
        '200': { description: 'A lista de novo', content: { application/json: { schema: { $ref: '#/components/schemas/StaffAlertList' } } } }

  /staff/alerts/{id}/dismiss:
    post:
      tags: [Equipe · operação]
      summary: Dispensar só para mim (só aviso informativo)
      description: 'Some da central e do Hoje desta pessoa; os outros continuam vendo. Aviso importante ou crítico responde 409 invalid_transition.'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: 'birthday:6f1c…' } }
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '204': { description: 'Dispensado' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/alerts/{id}/resolve:
    post:
      tags: [Equipe · operação]
      summary: Marcar como resolvido para todos (o que não some sozinho)
      description: 'Só os avisos marcados no catálogo como "resolve à mão" (conferir o "Não veio", a noite com queda, o lembrete que não saiu). Crítico nunca: some quando o problema acaba (409 invalid_transition). Fica no registro de ações.'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: 'no_show_review:2026-10-15' } }
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '204': { description: 'Resolvido' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/me/alert-preferences:
    get:
      tags: [Equipe · acesso]
      summary: Meus avisos (quais avisos importantes e informativos a pessoa segue)
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/AlertPreferences' } } } }
    put:
      tags: [Equipe · acesso]
      summary: Gravar os avisos que a pessoa não segue
      description: 'Código crítico na lista responde 422 (crítico não desliga). Códigos que o perfil não recebe são ignorados.'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [muted], properties: { muted: { type: array, items: { $ref: '#/components/schemas/StaffAlertKind' } } } } } }
      responses:
        '200': { description: 'Gravado', content: { application/json: { schema: { $ref: '#/components/schemas/AlertPreferences' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/reservations:
    get:
      tags: [Equipe · operação]
      summary: Lista de reservas com filtros
      description: 'O papel floor só vê as reservas de hoje, no fuso da casa, cortadas para o papel (primeiro nome, telefone mascarado, observações e marcadores).'
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/ReservationStatus' } }, style: form, explode: false }
        - { name: source, in: query, schema: { $ref: '#/components/schemas/ReservationSource' } }
        - { name: q, in: query, description: 'Nome, telefone ou código', schema: { type: string } }
        - { name: without_table, in: query, description: 'Só as que ficaram sem mesa depois de uma troca de planta', schema: { type: boolean } }
        - { name: view, in: query, description: 'Visão da tela (lista, dia, mesas, semana, mês); não muda o filtro', schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationPage' } } } }
    post:
      tags: [Equipe · operação]
      summary: Nova reserva pela equipe (telefone, balcão, WhatsApp)
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReservationStaffCreate' } } }
      responses:
        '201': { description: 'Criada', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationStaff' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/reservations/export:
    post:
      tags: [Equipe · operação]
      summary: Exportar reservas em CSV com os filtros da tela (dono; confirmação de identidade recente; fica no registro)
      description: 'Operação sensível (FR-74): sem a confirmação de identidade dos últimos 5 minutos, 403 reauth_required. Os mesmos filtros da lista (período, status, canal e busca, 5.11).'
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExportRequest' } } }
      responses:
        '200': { description: 'CSV, sem dado de saúde; o nome vem em Content-Disposition', content: { text/csv: { schema: { type: string } } } }

  /staff/reservations/{id}:
    get:
      tags: [Equipe · operação]
      summary: Detalhe da reserva com a linha do tempo
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /staff/reservations/{id}/actions:
    post:
      tags: [Equipe · operação]
      summary: Ação sobre a reserva
      description: 'Cada valor de action é um comando do domínio e uma permissão reservation.<action> (AD-4, AD-9). Transições fora das regras voltam 409 invalid_transition. check_in abre a sessão de mesa na mesma transação (AD-28); depois dele, a mesa só se libera pela sessão. Idempotency-Key gerada no aparelho; If-Match só em move_tables, reschedule e note.'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReservationAction' } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationStaff' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/reservations/{id}/notify:
    post:
      tags: [Equipe · operação]
      summary: Mandar ao cliente uma mensagem pronta da recepção (lista fechada de modelos aprovados)
      description: 'Entra na outbox com a chave <template>:<reservation_id>:<seq> (AD-5). Acima do teto diário de mensagens, nasce held e vira o aviso `message_held` na central do painel. Sem telefone verificado ou sem WhatsApp, 409 needs_whatsapp.'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [template], properties: { template: { $ref: '#/components/schemas/ReadyMessageTemplate' }, repeat: { type: boolean, description: 'Mandar de novo a mesma mensagem enviada nos últimos 10 minutos (sem isso, 409 conflict, reason recently_sent)' } } } } }
      responses:
        '202': { description: 'Na fila', content: { application/json: { schema: { $ref: '#/components/schemas/MessageQueued' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/floor:
    get:
      tags: [Equipe · operação]
      summary: Salão ao vivo (áreas, mesas, reservas, sessões de mesa abertas e quem sentou sem reserva)
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/FloorState' } } } }

  /staff/floor/walk-ins:
    post:
      tags: [Equipe · operação]
      summary: Sentar sem reserva
      description: 'create(source=walk_in) seguido de check_in numa transação: já abre a sessão de mesa (AD-28). Não existe POST de sessão avulsa. Sem table_codes, area_key de uma área em modo lista (balcão).'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/FloorCommand' }, { type: object, required: [party_size], properties: { table_codes: { type: array, items: { type: string, example: B1 } }, area_key: { $ref: '#/components/schemas/AreaKey' }, party_size: { type: integer, minimum: 1 }, name: { type: string } } }] } } }
      responses:
        '201': { description: 'Sentado (a reserva, já com a sessão de mesa aberta)', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationStaff' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/floor/sessions/{id}:
    get:
      tags: [Equipe · operação]
      summary: Uma sessão de mesa, com a linha do tempo
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/TableSessionDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Equipe · operação]
      summary: Corrigir quantas pessoas estão na mesa
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/FloorCommand' }, { type: object, required: [people], properties: { people: { type: integer, minimum: 1 } } }] } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/TableSession' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { description: 'Noite fechada: falta o motivo da correção (validation, reason correction_reason_required)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/floor/sessions/{id}/move:
    post:
      tags: [Equipe · operação]
      summary: Trocar a mesa da sessão
      description: 'Chama domain.occupancy; mesa ocupada volta 409 conflict.'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/FloorCommand' }, { type: object, required: [table_codes], properties: { table_codes: { type: array, minItems: 1, items: { type: string } } } }] } } }
      responses:
        '200': { description: 'Trocada', content: { application/json: { schema: { $ref: '#/components/schemas/TableSession' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 'Noite fechada: falta o motivo da correção (validation, reason correction_reason_required)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/floor/sessions/{id}/merge:
    post:
      tags: [Equipe · operação]
      summary: Juntar outra sessão a esta (as mesas e as pessoas passam para esta; a outra fecha)
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/FloorCommand' }, { type: object, required: [session_id], properties: { session_id: { type: string, format: uuid, description: 'A sessão que entra nesta' } } }] } } }
      responses:
        '200': { description: 'Juntadas', content: { application/json: { schema: { $ref: '#/components/schemas/TableSession' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 'Noite fechada: falta o motivo da correção (validation, reason correction_reason_required)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/floor/sessions/{id}/split:
    post:
      tags: [Equipe · operação]
      summary: Separar mesas desta sessão numa sessão nova, da mesma reserva de origem
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/FloorCommand' }, { type: object, required: [table_codes], properties: { table_codes: { type: array, minItems: 1, items: { type: string }, description: 'Mesas que saem para a sessão nova' }, people: { type: integer, minimum: 1, description: 'Pessoas que vão junto' } } }] } } }
      responses:
        '200': { description: 'Separadas: a sessão que ficou e a nova', content: { application/json: { schema: { type: object, properties: { session: { $ref: '#/components/schemas/TableSession' }, new_session: { $ref: '#/components/schemas/TableSession' } } } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 'Noite fechada: falta o motivo da correção (validation, reason correction_reason_required)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/floor/sessions/{id}/release:
    post:
      tags: [Equipe · operação]
      summary: Liberar a mesa (o grupo foi embora); fecha a sessão
      description: 'Libera a ocupação e grava capacity_freed (AD-4). Aceita occurred_at até 6 h no passado e na mesma noite (AD-28).'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/FloorCommand' } } }
      responses:
        '200': { description: 'Liberada', content: { application/json: { schema: { $ref: '#/components/schemas/TableSession' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 'Noite fechada: falta o motivo da correção (validation, reason correction_reason_required)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/floor/sessions/{id}/reopen:
    post:
      tags: [Equipe · operação]
      summary: Desfazer a liberação da mesa, pelo aviso que aparece logo depois de liberar
      description: 'Só enquanto a mesa não foi para outra pessoa e na mesma noite; senão 409 conflict.'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/FloorCommand' } } }
      responses:
        '200': { description: 'Aberta de novo', content: { application/json: { schema: { $ref: '#/components/schemas/TableSession' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 'Noite fechada: falta o motivo da correção (validation, reason correction_reason_required)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/floor/sessions/{id}/extend:
    post:
      tags: [Equipe · operação]
      summary: Mais 10 minutos de mesa para a sessão
      description: 'Soma 10 minutos ao fim previsto da sessão, se a mesa não tem reserva logo depois (senão 409 conflict). Para quem ainda não chegou, a tolerância extra é a action extra_tolerance da reserva.'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/FloorCommand' } } }
      responses:
        '200': { description: 'Estendida', content: { application/json: { schema: { $ref: '#/components/schemas/TableSession' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 'Noite fechada: falta o motivo da correção (validation, reason correction_reason_required)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/night/snapshot:
    get:
      tags: [Equipe · operação]
      summary: Retrato da noite para o aparelho guardar e mostrar sem conexão (AD-32)
      description: 'Reservas, espera, planta e sessões da noite, com telefone mascarado e sem dado de saúde. O aparelho guarda no IndexedDB com a hora da leitura; o night_close manda apagar o da noite anterior. Também é a folha da noite (CSS de impressão).'
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      parameters:
        - { name: date, in: query, description: 'Vazio = a noite atual (AD-7)', schema: { type: string, format: date } }
        - { name: since, in: query, description: 'Só o que mudou depois deste instante (a folha curta, 6.10): vem em changes', schema: { type: string, format: date-time } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/NightSnapshot' } } } }

  /staff/night/sheet:
    post:
      tags: [Equipe · operação]
      summary: A folha da noite foi impressa (inteira ou só o que mudou); o alerta de imprimir sai do Hoje
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { kind: { type: string, enum: [full, changes], default: full } } } } }
      responses:
        '200': { description: 'Anotado', content: { application/json: { schema: { type: object, properties: { date: { type: string, format: date }, sheet_printed_at: { type: [string, 'null'], format: date-time }, changes_printed_at: { type: [string, 'null'], format: date-time } } } } } }

  /staff/night/postpone:
    post:
      tags: [Equipe · operação]
      summary: Adiar o fechamento da noite em 1 hora, uma vez por noite (dono ou gerente, 6.14)
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { description: 'Adiado', content: { application/json: { schema: { type: object, properties: { date: { type: string, format: date }, close_at: { type: string, format: date-time } } } } } }
        '409': { description: 'Já adiado nesta noite', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/night/close:
    post:
      tags: [Equipe · operação]
      summary: Fechar à mão uma noite que não fechou (dono ou gerente, 6.14)
      description: 'Fecha as sessões abertas, marca "Não veio" em quem passou da tolerância sem chegar e grava a noite como fechada (night_close). Depois disso, mudanças da noite pedem motivo (correction_reason).'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { date: { type: string, format: date, description: 'A noite; vazio = a última' } } } } }
      responses:
        '200': { description: 'Fechada', content: { application/json: { schema: { $ref: '#/components/schemas/NightClose' } } } }
        '409': { description: 'A noite já está fechada', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/night/corrections:
    post:
      tags: [Equipe · operação]
      summary: Mandar ao dono as anotações do papel que a recepção não conseguiu lançar (a noite já fechou, 6.13)
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/NightCorrectionInput' } } } } } }
      responses:
        '201': { description: 'Mandadas; o dono vê no Hoje', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NightCorrection' } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/night/corrections/{id}/apply:
    post:
      tags: [Equipe · operação]
      summary: O dono lança uma anotação do papel (com o motivo de corrigir a noite fechada)
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content: { application/json: { schema: { type: object, properties: { correction_reason: { type: string, maxLength: 280 } } } } }
      responses:
        '200': { description: 'Lançada', content: { application/json: { schema: { $ref: '#/components/schemas/NightCorrection' } } } }
        '409': { description: 'Já resolvida ou não dá mais para lançar', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/night/corrections/{id}/dismiss:
    post:
      tags: [Equipe · operação]
      summary: O dono descarta uma anotação do papel
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: 'Descartada', content: { application/json: { schema: { $ref: '#/components/schemas/NightCorrection' } } } }
        '409': { description: 'Já resolvida', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/stream:
    get:
      tags: [Equipe · operação]
      summary: Avisos de mudança em tempo real por SSE (AD-27)
      description: 'Cada evento é só uma dica: a tela refaz o GET da entidade ou da lista e nunca aplica dado do aviso. Formato: `event: invalidate` com `data` = StreamInvalidate em JSON, filtrado pelo que o perfil lê. O aparelho abre por fetch com os cabeçalhos de deviceSignature, não por EventSource. Se cair, volta a consulta de 20 s com ETag.'
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      responses:
        '200':
          description: Fluxo de eventos
          content:
            text/event-stream:
              schema: { type: string, description: 'Linhas SSE: event: invalidate / data: {"entity":"reservation","id":"…","version":"7"}' }
              x-event-data: { $ref: '#/components/schemas/StreamInvalidate' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /staff/availability:
    get:
      tags: [Equipe · operação]
      summary: Mesas livres para a equipe num horário (qualquer mesa da planta do dia, inclusive as guardadas)
      description: Usada na nova reserva pela equipe, ao remarcar e ao trocar de mesa. O front nunca calcula vaga.
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/Date'
        - { name: time, in: query, required: true, schema: { type: string, example: '20:30' } }
        - $ref: '#/components/parameters/PartySize'
        - { name: ignore_reservation, in: query, description: 'A reserva que está sendo remarcada ou trocada', schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StaffTableOption' } } } } }

  /staff/waitlist:
    get:
      tags: [Equipe · operação]
      summary: Lista de espera da noite, por horário, com a espera de quem chega sem reserva
      description: 'Responde ETag; com If-None-Match igual, 304 sem corpo (a consulta de 20 s da recepção).'
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      parameters:
        - { name: date, in: query, description: 'Vazio = a noite atual', schema: { type: string, format: date } }
        - { name: If-None-Match, in: header, description: 'O ETag da última leitura', schema: { type: string } }
      responses:
        '200': { description: 'OK', headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReservationStaff' } } } } }
        '304': { description: 'Nada mudou' }
    post:
      tags: [Equipe · operação]
      summary: Pôr na espera da porta um grupo que chegou sem reserva (5.13)
      description: 'Até max_per_slot grupos por horário (422 com o campo time quando cheio). O telefone é opcional: sem ele, a recepção chama na porta.'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name, party_size, time], properties: { name: { type: string, minLength: 1, maxLength: 60 }, party_size: { type: integer, minimum: 1 }, time: { type: string, example: '21:00' }, phone: { type: string, description: 'E.164, opcional' } } } } }
      responses:
        '201': { description: 'Na espera', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationStaff' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/waitlist/{id}/notify:
    post:
      tags: [Equipe · operação]
      summary: '"Sua mesa está pronta" para o grupo da espera da porta que deixou telefone'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content: { application/json: { schema: { type: object, properties: { template: { $ref: '#/components/schemas/ReadyMessageTemplate' }, repeat: { type: boolean, description: 'Mandar de novo dentro de 10 minutos' } } } } }
      responses:
        '202': { description: 'Na fila: a entrada da espera com last_notified', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationStaff' } } } }
        '409': { description: 'Sem telefone, ou mandada há pouco (reason recently_sent)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/waitlist/{id}/offer:
    post:
      tags: [Equipe · operação]
      summary: 'Oferecer mesa a quem está na espera (manda WhatsApp; vale waitlist_offer_min)'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content: { application/json: { schema: { type: object, properties: { table_codes: { type: array, items: { type: string } } } } } }
      responses:
        '200': { description: 'Oferta enviada', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationStaff' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/calendar:
    get:
      tags: [Equipe · operação]
      summary: Mês na agenda (abertura, ocupação, reservas, eventos, bloqueios)
      security: [{ staffSession: [] }]
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CalendarDay' } } } } }

  /staff/day-plans:
    get:
      tags: [Equipe · operação]
      summary: Planos do dia de um período (só as datas que fogem da semana padrão)
      security: [{ staffSession: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DayPlan' } } } } }
    put:
      tags: [Equipe · operação]
      summary: Aplicar o mesmo plano a várias datas (férias, sequência de feriados)
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [dates, plan], properties: { dates: { type: array, items: { type: string, format: date } }, plan: { $ref: '#/components/schemas/DayPlanInput' }, confirm_conflicts: { type: boolean }, resolutions: { type: array, items: { $ref: '#/components/schemas/Resolution' } } } } } }
      responses:
        '200': { description: 'Gravado ou simulação', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DayPlanResult' } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '409': { description: 'Alguma data tem reserva sem mesa ou seria fechada com reserva ativa', content: { application/problem+json: { schema: { type: array, items: { $ref: '#/components/schemas/DayPlanConflict' } } } } }

  /staff/day-plans/{date}:
    get:
      tags: [Equipe · operação]
      summary: O dia como vai funcionar (semana padrão, plano do dia e evento), já resolvido
      security: [{ staffSession: [] }]
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ResolvedDay' } } } }
    put:
      tags: [Equipe · operação]
      summary: Definir o plano de uma data (planta, horário, limites, mesas guardadas, áreas fechadas, dia fechado)
      description: 'Com dry_run=true devolve quem mantém a mesa, quem muda e quem fica sem mesa, sem gravar. Sem confirm_conflicts, a gravação é recusada (409) enquanto houver reserva sem mesa. Fechar um dia com reserva ativa é sempre recusado (409 day_has_reservations): a equipe remarca ou cancela antes.'
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
        - { name: dry_run, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DayPlanInput' } } }
      responses:
        '200': { description: 'Gravado ou simulação', content: { application/json: { schema: { $ref: '#/components/schemas/DayPlanResult' } } } }
        '409': { description: 'Reservas sem mesa, ou dia fechado com reserva ativa', content: { application/problem+json: { schema: { $ref: '#/components/schemas/DayPlanConflict' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [Equipe · operação]
      summary: Voltar a data para a semana padrão (também com simulação)
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
        - { name: dry_run, in: query, schema: { type: boolean } }
        - { name: confirm_conflicts, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content: { application/json: { schema: { type: object, properties: { resolutions: { type: array, items: { $ref: '#/components/schemas/Resolution' }, description: 'A decisão da equipe sobre cada reserva que fica sem mesa (3.6)' } } } } }
      responses:
        '200': { description: 'Resultado', content: { application/json: { schema: { $ref: '#/components/schemas/DayPlanResult' } } } }
        '409': { description: 'Reservas sem mesa; resolver ou confirmar', content: { application/problem+json: { schema: { $ref: '#/components/schemas/DayPlanConflict' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /staff/events:
    get:
      tags: [Equipe · operação]
      summary: Eventos de um período
      security: [{ staffSession: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { next_cursor: { type: [string, 'null'] }, items: { type: array, items: { $ref: '#/components/schemas/Event' } } } } } } }
    post:
      tags: [Equipe · operação]
      summary: Criar evento (já com o plano do dia)
      description: 'Evento publicado num dia com reservas passa pela simulação: dry_run=true mostra o efeito; sem confirm_conflicts, a gravação é recusada (409) enquanto houver reserva sem mesa.'
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EventInput' } } }
      responses:
        '201': { description: 'Criado', content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '200': { description: 'Simulação', content: { application/json: { schema: { $ref: '#/components/schemas/DayPlanResult' } } } }
        '409': { description: 'Reservas sem mesa, ou dia fechado com reserva ativa', content: { application/problem+json: { schema: { $ref: '#/components/schemas/DayPlanConflict' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/events/{id}:
    get:
      tags: [Equipe · operação]
      summary: Um evento, com o plano do dia e as contagens
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
    patch:
      tags: [Equipe · operação]
      summary: Editar, publicar ou despublicar evento
      description: 'Mudar planta, modo de reserva, horário ou publicação passa pela mesma simulação (dry_run, 409, confirm_conflicts).'
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: dry_run, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/EventInput' } } }
      responses:
        '200': { description: 'OK, ou a simulação com dry_run', content: { application/json: { schema: { anyOf: [{ $ref: '#/components/schemas/Event' }, { $ref: '#/components/schemas/DayPlanResult' }] } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '409': { description: 'Reservas sem mesa, ou dia fechado com reserva ativa', content: { application/problem+json: { schema: { $ref: '#/components/schemas/DayPlanConflict' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [Equipe · operação]
      summary: 'Remover evento (as reservas continuam; o dia volta ao plano anterior, com simulação)'
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: dry_run, in: query, schema: { type: boolean } }
        - { name: confirm_conflicts, in: query, schema: { type: boolean } }
      responses:
        '204': { description: 'Removido' }
        '200': { description: 'Simulação', content: { application/json: { schema: { $ref: '#/components/schemas/DayPlanResult' } } } }
        '409': { description: 'Reservas sem mesa; resolver ou confirmar', content: { application/problem+json: { schema: { $ref: '#/components/schemas/DayPlanConflict' } } } }

  /staff/events/{id}/duplicate:
    post:
      tags: [Equipe · operação]
      summary: Duplicar evento (com plano do dia e planta) para outra data
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [date], properties: { date: { type: string, format: date } } } } }
      responses:
        '201': { description: 'Criado', content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }

  /staff/events/{id}/guests:
    get:
      tags: [Equipe · operação]
      summary: Lista do evento (quem vem, quantos, horário de chegada, quem já chegou)
      security: [{ staffSession: [] }, { deviceSession: [], deviceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/GuestList' } } } }
    post:
      tags: [Equipe · operação]
      summary: Quem chega na porta fora da lista entra, se houver lugar, já com a chegada marcada
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [party_size], properties: { party_size: { type: integer, minimum: 1 }, area_key: { $ref: '#/components/schemas/AreaKey' }, name: { type: string }, note: { type: string, maxLength: 280 }, at_door: { type: boolean, description: 'Chegou na porta: entra já com a chegada marcada; sem isso, só o nome na lista (evento privado, 3.11)' } } } } }
      responses:
        '201': { description: 'Entrou', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationStaff' } } } }
        '409': { description: 'Lista cheia', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/events/{id}/guests/{reservation_id}:
    delete:
      tags: [Equipe · operação]
      summary: Tirar um nome da lista do evento (antes da chegada)
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: reservation_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'Tirado' }
        '409': { description: 'Já chegou', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/events/{id}/guests/{reservation_id}/check-in:
    post:
      tags: [Equipe · operação]
      summary: Marcar chegada na porta
      description: 'O mesmo comando check_in da rota de ações (AD-4), na tela da lista do evento; abre a sessão na área em modo lista (area_code, sem mesa).'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: reservation_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { people: { type: integer, description: 'Quantos entraram, quando chega só parte do grupo' }, occurred_at: { type: string, format: date-time, description: 'Hora real do aparelho (AD-28)' } } } } }
      responses:
        '200': { description: 'Marcado', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationStaff' } } } }
        '422': { description: 'Noite fechada: falta o motivo da correção (validation, reason correction_reason_required)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    delete:
      tags: [Equipe · operação]
      summary: Desfazer a chegada marcada por engano
      description: 'O comando undo_check_in: até o prazo do grupo floor e nunca depois do fechamento da noite.'
      security: [{ staffSession: [], csrf: [] }, { deviceSession: [], deviceSignature: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: reservation_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Desfeito', content: { application/json: { schema: { $ref: '#/components/schemas/ReservationStaff' } } } }
        '422': { description: 'Noite fechada: falta o motivo da correção (validation, reason correction_reason_required)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/events/{id}/guests/export:
    post:
      tags: [Equipe · operação]
      summary: Exportar a lista do evento em CSV, sem telefones (dono; confirmação de identidade recente)
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ExportRequest' } } }
      responses:
        '200': { description: 'CSV', content: { text/csv: { schema: { type: string } } } }

  /staff/customers:
    get:
      tags: [Equipe · operação]
      summary: Clientes (telefone mascarado)
      security: [{ staffSession: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } } }

  /staff/customers/language:
    get:
      tags: [Equipe · operação]
      summary: A língua guardada do cliente deste telefone, para sugerir na nova reserva pela equipe (5.6)
