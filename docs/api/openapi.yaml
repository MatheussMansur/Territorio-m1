        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: [string, 'null'] }
        summary: { type: string }
        changes: { type: object }
        actor_id: { type: [string, 'null'] }
        device_label: { type: [string, 'null'] }
        version: { type: [integer, string, 'null'], description: 'A versão gravada (histórico do grupo, 2.21)' }
    AuditPage:
      allOf:
