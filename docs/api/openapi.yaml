  /staff/settings:
    get:
      tags: [Equipe · casa]
      summary: Índice das configurações (versão, autor, data e pendências de cada grupo)
      description: 'Dono edita; gerente só vê (catálogo configuracoes.md). Pendência = tradução faltando, item a confirmar ou integração com problema.'
      security: [{ staffSession: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/SettingsIndex' } } } }

  /staff/settings/{group}:
    get:
      tags: [Equipe · casa]
      summary: Um grupo de configurações, validado pelo schema do grupo
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SettingsGroupParam'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/SettingsDocument' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Equipe · casa]
      summary: Salvar um grupo de configurações (dono)
      description: |
        Exige If-Match com a version lida; versão velha volta 412 (com current, para juntar ou descartar) e sem a versão, 428. Toda gravação vai para o registro com o antes e o depois (AD-29). Os limites são conferidos no servidor (422 com errors[] por campo). Grupos e campos marcados no catálogo pedem a confirmação de identidade recente (403 reauth_required, nunca 401, AD-23). O gerente só lê (403 settings_read_only).
        Valores "Futuras" (tempo de mesa, prazo de cancelamento, versão dos combinados, limites de criação) são copiados para a reserva na criação; valores "Todas" (tolerância, tolerância extra, oferta da espera) valem na hora. Mudar terms cria uma versão nova dos combinados.
        O que recalcula reservas não grava pelo domain.settings: o grupo hours (semana padrão, planta padrão de cada dia) e os campos da categoria "Sim" do booking (dias abertos, horários de chegada, intervalo, mesas guardadas) gravam pelo caminho do plano do dia e da troca de planta (AD-25), em domain.plans. Para eles o corpo leva o simulation_hash da prévia; se o efeito mudou, 409 plan_changed; reserva sem mesa sem confirm_conflicts, 409 com DayPlanConflict. integrations é só leitura (405).
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/SettingsGroupParam'
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettingsPatch' } } }
      responses:
        '200': { description: 'Gravado', content: { application/json: { schema: { $ref: '#/components/schemas/SettingsDocument' } } } }
        '400': { description: 'Faltam os dados da mudança', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '405': { description: 'Grupo só de leitura (integrations)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 'Efeito mudou desde a prévia (plan_changed) ou reservas sem mesa', content: { application/problem+json: { schema: { $ref: '#/components/schemas/DayPlanConflict' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/settings/{group}/preview:
    post:
      tags: [Equipe · casa]
      summary: Prévia do efeito de uma mudança, sem gravar (substitui o ?dry_run)
      description: 'Usa o mesmo código da gravação, sem commit (AD-29). Diz a quantas reservas a mudança se aplica e, para o que recalcula reservas, devolve a simulação por data e o simulation_hash que o PATCH manda de volta.'
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/SettingsGroupParam'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettingsPatch' } } }
      responses:
        '200': { description: 'Prévia', content: { application/json: { schema: { $ref: '#/components/schemas/SettingsPreview' } } } }
        '400': { description: 'Faltam os dados da mudança', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

