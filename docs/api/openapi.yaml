      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ContentBlock' } } } } }

  /staff/content/{block}:
    put:
      tags: [Equipe · conteúdo]
      summary: Salvar rascunho de um bloco (só texto, com limite por campo)
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/ContentBlockKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { fields: { type: object } } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ContentBlock' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/content/{block}/publish:
    post:
      tags: [Equipe · conteúdo]
      summary: Publicar o rascunho de um bloco
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/ContentBlockKey'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ContentBlock' } } } }
        '409': { description: 'Palavra proibida (com words) ou nada para publicar', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/content/{block}/versions:
    get:
      tags: [Equipe · conteúdo]
      summary: Versões publicadas de um bloco
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ContentBlockKey'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ContentBlock' } } } } }

  /staff/content/{block}/restore:
    post:
      tags: [Equipe · conteúdo]
      summary: Voltar para uma versão anterior (vira rascunho)
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/ContentBlockKey'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: [integer, string] } } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ContentBlock' } } } }

  /staff/images:
    get:
      tags: [Equipe · conteúdo]
      summary: Galeria
      security: [{ staffSession: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Image' } } } } }
    post:
      tags: [Equipe · conteúdo]
      summary: Enviar foto (até 15 MB; o servidor regrava e tira os metadados)
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file, alt], properties: { file: { type: string, format: binary }, alt: { type: string }, credit: { type: string }, area: { type: string, description: 'Onde a foto foi tirada (área da casa), opcional' } } }
      responses:
        '201': { description: 'Recebida; status processing até as versões ficarem prontas', content: { application/json: { schema: { $ref: '#/components/schemas/Image' } } } }
        '413': { description: 'Arquivo grande demais (upload_too_large)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '415': { description: 'Tipo de arquivo não aceito (upload_type)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/images/{id}:
    patch:
      tags: [Equipe · conteúdo]
      summary: Texto alternativo, crédito e ponto de foco
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content: { application/json: { schema: { type: object, properties: { alt: { type: string }, credit: { type: string }, area: { type: string }, sort: { type: integer }, focal_x: { type: number }, focal_y: { type: number } } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Image' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Equipe · conteúdo]
      summary: Apagar foto (bloqueado se está em uso)
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: 'Apagada' }
        '409': { description: 'Em uso (com usages)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/images/{id}/file:
    put:
      tags: [Equipe · conteúdo]
      summary: Trocar o arquivo de uma foto em uso, mantendo onde ela aparece
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } }
      responses:
        '200': { description: 'Trocada', content: { application/json: { schema: { $ref: '#/components/schemas/Image' } } } }
        '413': { description: 'Arquivo grande demais (upload_too_large)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '415': { description: 'Tipo de arquivo não aceito (upload_type)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/site/builds:
    get:
      tags: [Equipe · conteúdo]
      summary: Situação da publicação do site (a tarefa site_render que regera o HTML estático)
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'Mais recentes primeiro', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SiteBuild' } } } } }
    post:
      tags: [Equipe · conteúdo]
      summary: '"Publicar de novo" depois de uma publicação do site que falhou (2.8, 2.13, 2.16, 2.17)'
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 120 } } } } }
      responses:
        '200': { description: 'Publicação pedida', content: { application/json: { schema: { $ref: '#/components/schemas/SiteBuild' } } } }
        '202': { description: 'Publicação pedida', content: { application/json: { schema: { $ref: '#/components/schemas/SiteBuild' } } } }

  /staff/site/stats:
    get:
      tags: [Equipe · conteúdo]
      summary: Visitas e páginas do site (números de exemplo até o contador ir ao ar, 10.16)
      security: [{ staffSession: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/SiteStats' } } } }

  # ---------------------------------------------------------------- equipe · administração
  /staff/users:
    get:
      tags: [Equipe · administração]
      summary: Equipe (dono)
      security: [{ staffSession: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Equipe · administração]
      summary: Cadastrar pessoa só de PIN (recepção), sem e-mail, com nome, perfil e telefone
      description: 'O PIN é os últimos 4 dígitos do telefone, calculado no cadastro e guardado com argon2id (AD-26). Não há código de primeiro acesso.'
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PinUserCreate' } } }
      responses:
        '201': { description: 'Criada', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/users/invite:
    post:
      tags: [Equipe · administração]
      summary: Convidar (link de 72 horas)
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, role], properties: { email: { type: string, format: email }, role: { $ref: '#/components/schemas/Role' }, name: { type: string } } } } }
      responses:
        '201': { description: 'Convite criado', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '409': { description: 'E-mail já na equipe', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/users/{id}:
    patch:
      tags: [Equipe · administração]
      summary: Mudar papel, telefone (recalcula o PIN) ou desativar (sempre sobra um dono)
      description: 'Mudar o papel é sensível (FR-74): pede a confirmação de identidade recente (403 reauth_required).'
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content: { application/json: { schema: { type: object, properties: { name: { type: string }, role: { $ref: '#/components/schemas/Role' }, status: { $ref: '#/components/schemas/UserStatusChange' }, phone: { type: string, description: 'E.164; o PIN passa a ser os últimos 4 dígitos do número novo' }, password: { type: string, description: 'A senha de quem muda; obrigatória quando o papel muda' } } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/users/{id}/invite/resend:
    post:
      tags: [Equipe · administração]
      summary: Reenviar o convite (novo link de 72 horas; o anterior deixa de valer)
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: 'Reenviado', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'A pessoa já aceitou o convite', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /staff/users/{id}/revoke-sessions:
    post:
      tags: [Equipe · administração]
      summary: Encerrar todas as sessões de uma pessoa
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: 'Encerradas' }

  /staff/users/{id}/mfa/reset:
    post:
      tags: [Equipe · administração]
      summary: Zerar a verificação em duas etapas de uma pessoa (dono; confirmação de identidade recente)
      description: 'A pessoa cadastra um aplicativo novo no próximo login; todas as sessões dela são encerradas (N1). Fica no registro, sem o segredo.'
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content: { application/json: { schema: { type: object, properties: { password: { type: string, description: 'Antigo; a confirmação de identidade (POST /staff/auth/reauth) é que vale' } } } } }
      responses:
        '200': { description: 'Zerada', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }

  /staff/permissions:
    get:
      tags: [Equipe · administração]
      summary: 'Permissões por área (1.15): as áreas que cada perfil abre, o padrão de permissoes.yaml e quem mudou por último'
      security: [{ staffSession: [] }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Permissions' } } } }
    put:
      tags: [Equipe · administração]
      summary: Gravar as áreas de cada perfil (dono; confirmação de identidade recente)
      description: 'O dono sempre tem todas as áreas. Uma área tirada some do menu e as operações dela respondem 403 forbidden para o perfil (FR-82). reset volta ao padrão.'
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PermissionsInput' } } }
      responses:
        '200': { description: 'Gravado', content: { application/json: { schema: { $ref: '#/components/schemas/Permissions' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/audit:
    get:
      tags: [Equipe · administração]
      summary: Registro de ações (dono)
      security: [{ staffSession: [] }]
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, description: 'Uma ação (settings.update) ou o começo dela (settings)', schema: { type: string } }
        - { name: entity, in: query, description: 'A entidade, como tipo:id (settings:booking, o histórico de um grupo, 2.21)', schema: { type: string } }
        - { name: device, in: query, description: 'Nome ou id do aparelho', schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }

  /staff/audit/export:
    post:
      tags: [Equipe · administração]
      summary: Exportar o registro em CSV com os filtros da tela (dono; confirmação de identidade recente)
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExportRequest' } } }
      responses:
        '200': { description: 'CSV', content: { text/csv: { schema: { type: string } } } }

  /staff/privacy/requests:
    get:
      tags: [Equipe · administração]
      summary: Pedidos do titular (LGPD), com prazo de 15 dias (dono)
      security: [{ staffSession: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PrivacyRequestStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequestPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Equipe · administração]
      summary: Registrar um pedido do titular que chegou por WhatsApp, e-mail ou na casa
      description: 'Pedido feito pela conta (DELETE /me) já nasce aqui. O dono de privacy_requests é domain.customers (AD-11).'
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequestInput' } } }
      responses:
        '201': { description: 'Registrado', content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequest' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff/privacy/requests/{id}/resolve:
    post:
      tags: [Equipe · administração]
      summary: Dar o pedido por atendido (ou recusado, com motivo); fica no registro
      description: 'Atender um pedido de exclusão chama a anonimização (cancel das reservas futuras com mensagem, AD-11) e pede reautenticação recente.'
      security: [{ staffSession: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequestResolve' } } }
      responses:
        '200': { description: 'Atendido', content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequest' } } } }
        '409': { description: 'Pedido já resolvido', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    staffSession: { type: apiKey, in: cookie, name: __Host-trt_equipe, description: 'Sessão da equipe (httpOnly, Secure, SameSite=Strict); registro de cookies, AD-37' }
    customerSession: { type: apiKey, in: cookie, name: __Host-trt_sessao, description: 'Sessão do cliente (httpOnly, Secure, SameSite=Lax; 90 dias com "lembrar aparelho"); registro de cookies, AD-37' }
    csrf: { type: apiKey, in: header, name: X-CSRF-Token, description: 'Exigido em toda requisição que muda dado; o token vem no login, no código do WhatsApp e em GET /me ou /staff/auth/session' }
    deviceSession: { type: apiKey, in: cookie, name: __Host-trt_aparelho, description: 'Sessão do aparelho da casa (httpOnly, Secure, SameSite=Strict, 12 meses; registro de cookies, AD-37), aberta por desafio assinado (AD-26). A pessoa ativa entra por PIN dentro dela; sem pessoa ativa, só lê a tela de bloqueio. Vale só junto com deviceSignature.' }
    deviceSignature:
      type: apiKey
      in: header
      name: X-Device-Signature
      description: |
        Assinatura do aparelho em toda requisição da sessão de aparelho (AD-26, emenda de 14/10). Cabeçalhos:
        - `X-Device-Id`: id do aparelho aprovado;
        - `X-Device-Time`: instante do aparelho, ISO 8601 em UTC; fora de ±5 min é recusado;
        - `X-Device-Nonce`: aleatório; repetido em 10 min é recusado;
        - `X-Device-Signature`: base64url da assinatura ECDSA P-256/SHA-256 de `METHOD\nPATH?QUERY\nX-Device-Time\nSHA256(corpo)\nX-Device-Nonce`.
        O servidor confere a assinatura com a chave pública do pareamento e `devices.status = approved` a cada requisição; aparelho revogado cai na hora (403 device_not_approved, 401 device_signature_invalid).
    metaSignature: { type: apiKey, in: header, name: X-Hub-Signature-256, description: 'HMAC-SHA256 dos bytes crus do corpo com o segredo do app da Meta, conferido com compare_digest antes de ler o JSON (AD-12)' }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Token: { name: token, in: path, required: true, schema: { type: string, minLength: 22 } }
    ContentBlockKey: { name: block, in: path, required: true, schema: { type: string, enum: [cover, today, about, experience, notices, testimonials, links, seo] } }
    Date: { name: date, in: query, required: true, schema: { type: string, format: date } }
    PartySize: { name: party_size, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 20 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    IdempotencyKeyOptional: { name: Idempotency-Key, in: header, description: 'Gerada no aparelho para os comandos da recepção (AD-28); mesma chave devolve a mesma resposta', schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, description: 'A version que a tela leu; versão velha devolve 412', schema: { type: string } }
    IfMatchRequired: { name: If-Match, in: header, required: true, description: 'A version do grupo que a tela leu; versão velha devolve 412', schema: { type: string } }
    ReservationCode: { name: code, in: path, required: true, schema: { type: string, example: TR-4821 } }
    SettingsGroupParam: { name: group, in: path, required: true, schema: { $ref: '#/components/schemas/SettingsGroup' } }
    Lang: { name: lang, in: query, description: 'Língua do texto editável; vazio = pt. Língua sem tradução cai no pt (AD-35)', schema: { $ref: '#/components/schemas/Locale' } }

  responses:
    ValidationError: { description: 'Dados inválidos', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: 'Sem sessão', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: 'Sem permissão para este papel', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: 'Não encontrado', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: 'Conflito (transição inválida, vaga, duplicidade)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    TooManyRequests: { description: 'Limite atingido; `Retry-After` diz quando tentar de novo', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PreconditionFailed: { description: 'Alguém mudou isso antes (version diferente); recarregar', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  schemas:
    # ---------- base
    Problem:
      type: object
      description: 'problem+json (RFC 9457). Além dos campos base, os membros de extensão abaixo aparecem conforme o tipo; a tela usa o catálogo de mensagens pelo `type` (e pelo `reason`, quando há).'
      required: [type, title, status]
      properties:
        type: { $ref: '#/components/schemas/ProblemType' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
        request_id: { type: string }
        reason: { type: [string, 'null'], description: 'Detalhe do tipo para o catálogo: otp, idempotency, recently_sent, clock, nonce, signature, missing, late, late_off, unassigned, correction_reason_required; em slot_full: cutoff, day_closed, event_mode ou waitlist_full' }
        event_mode: { $ref: '#/components/schemas/EventBookingMode', description: 'slot_full com reason event_mode: o modo do evento da noite' }
        reason_label: { type: [string, 'null'], description: 'slot_full com reason day_closed: o motivo público do dia' }
        code: { type: string, description: 'Subtipo do conflito (ex.: unassigned = reservas ficariam sem mesa)' }
        scope: { type: string, description: 'rate_limited: phone, ip ou house' }
        current: { description: 'precondition_failed: o que está gravado agora, para juntar ou descartar' }
        items: { type: array, description: 'O efeito que barrou a gravação (simulação por data, reservas afetadas)', items: {} }
        used_by: { description: 'area_in_use, layout_in_use, image in use: onde está em uso' }
        usages: { type: array, items: { type: string }, description: 'Onde a foto está em uso' }
        count: { type: integer }
        remaining_attempts: { type: integer, description: 'Código errado: tentativas que sobram' }
        locked_until: { type: [string, 'null'], format: date-time }
        retry_after_s: { type: integer }
        sent_at: { type: string, format: date-time, description: 'Mensagem pronta mandada há pouco' }
        server_time: { type: string, format: date-time }
        skew_s: { type: [integer, 'null'], description: 'Relógio do aparelho: diferença em segundos' }
        updated_by: { type: [string, 'null'] }
        alternatives: { type: array, items: { type: object, properties: { date: { type: string, format: date }, time: { type: string }, state: { $ref: '#/components/schemas/SlotState' } } } }
        existing: { $ref: '#/components/schemas/ReservationPublic' }
        missing: { type: array, items: { type: string }, description: 'google_scope_missing: as permissões que faltam' }
        build: { $ref: '#/components/schemas/SiteBuild' }
        words: { type: array, items: { type: string }, description: 'Palavras que não podem ir ao site' }
        name: { type: string, description: 'Conflito: quem já tem a mesa ou o horário' }
        time: { type: string, description: 'Conflito: o horário em questão' }
        hours: { type: integer, description: 'O prazo em horas (desfazer o "Não veio", cancelar)' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: phone }
        message: { type: string, example: Número de WhatsApp inválido }
    Page:
      type: object
      properties:
        next_cursor: { type: [string, 'null'] }

    # ---------- enums
    ReservationStatus: { type: string, enum: [pending, confirmed, waitlisted, offered, declined, expired, canceled, completed, no_show] }
    ReservationSource: { type: string, enum: [site, staff, whatsapp, phone, walk_in] }
    CustomerConfirmation: { type: string, enum: [not_sent, sent, 'yes', 'no', no_reply] }
    AreaKey: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,39}$', example: quintal, description: 'Chave de uma área da casa. Texto aberto: a casa cria e apaga áreas (/staff/areas); as de partida são salao, quintal e balcao' }
    AreaKeyNullable: { type: [string, 'null'], pattern: '^[a-z0-9][a-z0-9_-]{0,39}$', description: 'AreaKey, ou vazio quando não há área' }
    Flag: { type: string, enum: [birthday, high_chair, accessibility, dietary, no_whatsapp], description: 'no_whatsapp: o cliente não usa WhatsApp; a confirmação é por ligação (FR-31)' }
    Role: { type: string, enum: [owner, manager, floor] }
    SlotState: { type: string, enum: [available, few_left, full, past] }
    DayState: { type: string, enum: [available, few_left, full, closed, no_booking], description: 'no_booking: casa aberta sem reserva (evento de entrada livre)' }
    ClosedReason: { type: string, enum: [production, closed, event, holiday, maintenance, outside_window, past] }
    ClosedReasonNullable: { type: [string, 'null'], enum: [production, closed, event, holiday, maintenance, outside_window, past, null], description: 'ClosedReason, ou vazio no dia aberto' }
    EventBookingMode: { type: string, enum: [tables, list, mixed, private, none] }
    AreaMode: { type: string, enum: [tables, list, closed] }
    ProblemType:
      type: string
      description: 'Código do erro (AD-10), o mesmo que client.js compara. plan_changed = a simulação ficou velha (AD-25); preview_required = gravar o que recalcula reservas sem ver a prévia; reauth_required = falta senha e TOTP recentes (AD-23, sempre 403); undo_window_closed = passou o prazo de desfazer (check_in, no_show); night_closed = a noite já fechou; unavailable = sistema da casa fora (503); whatsapp_down = WhatsApp da casa fora (503); image_not_ready = a foto ainda está preparando; upload_too_large (413) e upload_type (415) no envio de foto; not_connected, google_scope_missing e google_no_scopes na conta Google; site_build_failed = a publicação do site falhou; static_mode = o site sem API (só no front, AR-13).'
      enum: [validation, bad_request, unauthorized, forbidden, not_found, conflict, gone, precondition_failed, rate_limited, server, unavailable, slot_full, duplicate_reservation, invalid_transition, active_limit, customer_blocked, terms_outdated, session_expired, csrf_failed, party_too_large, needs_whatsapp, account_disabled, day_has_reservations, plan_changed, preview_required, turnstile_failed, reauth_required, device_not_approved, device_signature_invalid, pin_invalid, pin_locked, no_active_person, undo_window_closed, night_closed, offer_expired, read_only_link, outside_cancel_window, phone_in_use, settings_read_only, image_not_ready, upload_too_large, upload_type, whatsapp_down, not_connected, google_scope_missing, google_no_scopes, site_build_failed, static_mode]
    Locale: { type: string, enum: [pt, es, en], description: 'Língua guardada na reserva e no cliente; a mensagem sai nela (AD-35)' }
    ReservationActionType:
      type: string
      enum: [approve, decline, confirm, reschedule, move_tables, cancel, check_in, undo_check_in, extra_tolerance, release, release_table, no_show, undo_no_show, forgive_no_show, resend_confirmation, call_answer, note]
      description: |
        Um comando do domínio por valor, e a permissão reservation.<valor> (AD-4, AD-9).
        - confirm: virar reserva quem está na lista de espera (com table_codes).
        - check_in: "Chegou". confirmed → completed (e pending com mesa → completed); abre a sessão de mesa na mesma transação (AD-28). Aceita occurred_at, people e table_codes.
        - undo_check_in: volta a confirmed dentro do prazo do grupo floor (padrão 15 min), só com a sessão sem nada pendurado, nunca depois do fechamento da noite. Aceita occurred_at.
        - release: "mesa vagou" antes de sentar, só para reserva sem check_in; não conta falta. Depois do check_in, quem libera é a sessão (/staff/floor/sessions/{id}/release). Aceita occurred_at.
        - no_show: passou da tolerância sem chegar; conta falta.
        - undo_no_show: desfaz "Não veio", volta a confirmed e desconta a falta; até o prazo do grupo approval_no_shows (padrão 24 h) e exige reason (FR-78).
        - forgive_no_show: perdoa a falta sem mudar o status; tira da contagem do cliente; exige reason.
        - extra_tolerance: +10 min para quem avisou que atrasa; uma vez por reserva (o aviso do cliente e a resposta da ligação não somam).
        - release_table: na recepção, a mesa de quem não chegou vai para quem espera (perde a prioridade, não conta falta).
        - call_answer: a resposta de quem confirmou por ligação (answer yes, no ou late; cliente sem WhatsApp, FR-31).
        - note: observação interna na linha do tempo (note).
    ReadyMessageTemplate: { type: string, enum: [table_waiting, table_ready, running_late], description: 'Mensagens prontas da recepção, cada uma um modelo aprovado na Meta: "Sua mesa está te esperando até {hora}", "Sua mesa está pronta", "Estamos com atraso de alguns minutos"' }
    SettingsGroup: { type: string, enum: [house, hours, access, alerts, appearance, booking, terms, approval_no_shows, waitlist, floor, messages, events, site, menu, privacy, cookies, integrations], description: 'Grupos de configuração (AD-29). O painel mapeia para os caminhos em português (/admin/configuracoes/aprovacao-e-faltas)' }
    SettingsScope: { type: string, enum: [future, all, recalculates, none], description: 'future = vale para reservas criadas depois; all = vale na hora para todas; recalculates = passa pela simulação do plano do dia (AD-25); none = não afeta reserva' }
    LargeGroupAction: { type: string, enum: [whatsapp, request] }
    ApprovalMode: { type: string, enum: [auto, manual, rules] }
    ToleranceEndAction: { type: string, enum: [suggest_no_show, auto_release] }
    ReceptionReschedule: { type: string, enum: [same_day, never] }
    ReminderMode: { type: string, enum: [fixed_time, before_open] }
    EventsAgendaMode: { type: string, enum: [always, only_with_event] }
    UnpricedItemMode: { type: string, enum: [hide, ask] }
    CookieCategory: { type: string, enum: [necessary, remember, measurement], description: 'AD-37: necessários, lembrar de mim, medição' }
    IntegrationKey: { type: string, enum: [whatsapp, google, turnstile, email, database, measurement, monitor, errors] }
    IntegrationStatus: { type: string, enum: [on, problem, off] }
    DeviceKind: { type: string, enum: [desktop, tablet, phone] }
    DeviceStatus: { type: string, enum: [pending, approved, rejected, expired, revoked] }
    TableSessionStatus: { type: string, enum: [open, closed] }
    TableSessionEventKind: { type: string, enum: [opened, moved, merged, split, people_changed, extended, released, undone] }
    StreamEntity: { type: string, enum: [reservation, table_session, waitlist, day_plan, event, layout, menu_item, settings, device, customer, alert], description: 'alert = a central de avisos mudou (nasceu, foi resolvido ou lido); a tela refaz GET /staff/alerts' }
    WebVitalName: { type: string, enum: [LCP, CLS, INP, FCP, TTFB] }
    WebVitalRating: { type: string, enum: [good, needs_improvement, poor] }
    SiteBuildStatus: { type: string, enum: [pending, running, done, failed] }
    PrivacyRequestKind: { type: string, enum: [access, correction, deletion, portability, opt_out] }
    PrivacyRequestStatus: { type: string, enum: [open, done, rejected] }
    PrivacyRequestChannel: { type: string, enum: [account, whatsapp, email, in_person] }
    UserStatus: { type: string, enum: [invited, active, disabled] }
    UserStatusChange: { type: string, enum: [active, disabled] }
    OnboardingStepKey: { type: string, enum: [house, hours, layouts, booking, terms, team, devices, messages] }
    MessageStatus: { type: string, enum: [pending, held, sending, sent, delivered, read, failed, expired] }
    StaffAlertKind: { type: string, enum: [whatsapp_down, whatsapp_blocked, queue_stuck, pending_expiring, pin_locked, device_key_lost, night_not_closed, pending_request, late_request, privacy_request, privacy_request_due, message_failed, message_held, meta_limit, google_failed, google_disconnect, offer_failed, device_pending, paper_correction, reminder_failed, no_show_review, outage_review, night_closing, backup_failed, system_errors, codes_not_arriving, whatsapp_quality, site_build_failed, email_failed, email_quota, template_rejected, large_group, birthday, dietary, without_table, no_reply, print_sheet, onboarding, waitlist_full, template_pending, restore_late, alerts_handed], description: 'Os avisos da equipe guardados pela casa, do catálogo único (src/admin/avisos/catalogo.js, FR-87): nível, quem recebe, quando some e o silêncio vêm de lá. no_show_review = "Não veio" marcado pelo fechamento da noite, para conferir; outage_review = noite com queda, conferir as chegadas; print_sheet = hora de imprimir a folha da noite' }
    StaffAlertLevel: { type: string, enum: [critical, important, info], description: 'critical: fica até resolver, ninguém desliga, fura o silêncio, faixa no topo de toda tela; important: conta no sino, some quando resolve; info: só na central e no Hoje, some no fim da noite, dispensa só para a pessoa' }
    FeedKind: { type: string, enum: [new, confirmed, customer_yes, customer_no, customer_late, customer_arriving, canceled, waitlisted, offered, offer_accepted, declined, walk_in, check_in, no_show, link_tap, waitlist_joined, booking_changed] }

    # ---------- textos em três línguas
    LocalizedText:
      type: object
      description: 'Texto editável nas três línguas (AD-35). pt é obrigatório; língua vazia cai no pt e fica marcada como pendente no painel.'
      required: [pt]
      properties:
        pt: { type: string }
        es: { type: [string, 'null'] }
        en: { type: [string, 'null'] }

    # ---------- casa
    Address:
      type: object
      properties:
        street: { type: string, example: Rua Sérgio Roncato }
        number: { type: string, example: '703' }
        district: { type: string, example: Conj. Res. Aporã (Vila A) }
        city: { type: string, example: Foz do Iguaçu }
        state: { type: string, example: PR }
        zip: { type: string }
        lat: { type: number }
        lng: { type: number }
    OpeningHours:
      type: object
      required: [weekday, open]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: '0 = domingo' }
        open: { type: boolean }
        label: { type: string, example: produção }
        opens_at: { type: string, example: '19:00' }
        closes_at: { type: string, example: '23:30' }
        slots: { type: array, items: { type: string, example: '19:30' } }
        layout_id: { type: [string, 'null'], format: uuid, description: 'Planta padrão deste dia da semana' }
        reason: { $ref: '#/components/schemas/ClosedReasonNullable' }
        second_shift: { type: [object, 'null'], description: 'O outro turno do dia, só com max_shifts_per_day = 2 (2.8)', properties: { opens_at: { type: string }, closes_at: { type: string } } }
    Terms:
      type: object
      description: 'Combinados como o cliente vê, já na língua pedida e com os números da configuração'
      properties:
        version: { type: string, example: '2026-10-14' }
        locale: { $ref: '#/components/schemas/Locale' }
        published_at: { type: string, format: date-time }
        accept_label: { type: string, example: Li e tá combinado }
        items:
          type: array
          items: { type: object, properties: { title: { type: string }, text: { type: string } } }
        locales: { type: object, description: 'Os combinados em cada língua (pt, es, en), com items e accept_label, para a página trocar de língua sem pedir de novo; o título de um item pode vir vazio', additionalProperties: { type: object, properties: { items: { type: array, items: { type: object, properties: { title: { type: [string, 'null'] }, text: { type: string } } } }, accept_label: { type: string } } } }
    AfterTolerance:
      type: string
      enum: [lose_priority, release]
      description: 'Depois da tolerância (e do extra, se avisou): lose_priority = a mesa deixa de ser prioridade do cliente e pode ir para quem espera, mas ele ainda senta se houver lugar; release = a mesa é liberada'
    BookingRulesPublic:
      type: object
      description: 'Os números que o cliente vê nos combinados, na reserva e no comprovante; todos vêm das configurações'
      properties:
        window_days: { type: integer }
        min_lead_min: { type: integer }
        party_max_online: { type: integer }
        large_group_action: { $ref: '#/components/schemas/LargeGroupAction' }
        tolerance_min: { type: integer }
        extra_tolerance_min: { type: integer }
        after_tolerance: { $ref: '#/components/schemas/AfterTolerance' }
        late_notice_enabled: { type: boolean }
        no_shows_for_confirmation: { type: integer, description: 'Faltas (na janela de meses) que fazem as próximas reservas passarem pela confirmação' }
        duration_min: { type: integer }
        cancel_until_hours: { type: integer }
        customer_can_reschedule: { type: boolean }
        customer_can_cancel_late: { type: boolean }
        online_enabled: { type: boolean, description: 'Falso mostra "reservas pelo WhatsApp"' }
        waitlist_enabled: { type: boolean }
        google_login: { type: boolean }
    HousePublic:
      type: object
      properties:
        server_time: { type: string, format: date-time }
        name: { type: string }
        tagline: { type: string }
        address: { $ref: '#/components/schemas/Address' }
        whatsapp: { type: string, description: 'E.164' }
        instagram: { type: string }
        timezone: { type: string, example: America/Sao_Paulo }
        hours: { type: array, items: { $ref: '#/components/schemas/OpeningHours' } }
        hours_confirmed: { type: boolean, description: 'Falso enquanto o horário estiver "a confirmar"' }
        booking: { $ref: '#/components/schemas/BookingRulesPublic' }
        terms: { $ref: '#/components/schemas/Terms' }
        areas: { type: array, items: { type: object, properties: { key: { $ref: '#/components/schemas/AreaKey' }, name: { type: string } } } }
        days: { type: array, items: { $ref: '#/components/schemas/DayStatus' }, description: 'Ontem, hoje e os próximos 14 dias, já resolvidos pelo plano do dia e pelos eventos: aberto agora, exceções da semana' }
        night_cutoff: { type: string, example: '05:00', description: 'Virada da noite no fuso da casa' }
        settings: { type: object, description: 'O que o site lê das configurações: cardápio (preço vazio, "acabou"), cookies (versão do aviso e medição), combinados e reserva', additionalProperties: {} }
    DayStatus:
      type: object
      required: [date, open]
      properties:
        date: { type: string, format: date }
        open: { type: boolean }
        opens_at: { type: [string, 'null'], example: '19:00' }
        closes_at: { type: [string, 'null'], example: '23:30', description: 'Pode ser depois da meia-noite (ex.: 01:00)' }
        second_shift: { type: [object, 'null'], description: 'O outro turno do dia, quando a casa abre em dois turnos (2.8); o site mostra os dois e conta o "Aberto agora" entre eles', properties: { opens_at: { type: string, example: '12:00' }, closes_at: { type: string, example: '15:00' } } }
        reason_label: { type: [string, 'null'], example: Feriado }
        reason_labels: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }], description: 'O motivo público nas três línguas (3.5, 3.10)' }
        reason: { $ref: '#/components/schemas/ClosedReasonNullable' }
        event_title: { type: [string, 'null'] }
        exception: { type: boolean, description: 'O dia foge da semana padrão' }

    # ---------- disponibilidade
    SlotAvailability:
      type: object
      required: [time, state]
      properties:
        time: { type: string, example: '20:30' }
        state: { $ref: '#/components/schemas/SlotState' }
        waitlist_open: { type: boolean }
    DayAvailability:
      type: object
      required: [date, open, state]
      properties:
        date: { type: string, format: date }
        open: { type: boolean }
        reason: { $ref: '#/components/schemas/ClosedReasonNullable' }
        reason_label: { type: [string, 'null'], example: produção }
        reason_labels: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }], description: 'O motivo nas três línguas' }
        waitlist_open: { type: boolean, description: 'Há horário com lista de espera aberta no dia' }
        state: { $ref: '#/components/schemas/DayState' }
        slots: { type: array, items: { $ref: '#/components/schemas/SlotAvailability' } }
        areas:
          type: array
          description: 'Áreas abertas no dia e como funcionam (para a preferência de área)'
          items: { type: object, properties: { key: { $ref: '#/components/schemas/AreaKey' }, name: { type: string }, mode: { type: string, enum: [tables, list] }, remaining: { type: [integer, 'null'] } } }
        list: { $ref: '#/components/schemas/ListAvailability' }
        event: { $ref: '#/components/schemas/EventSummary' }
        party_max_online: { type: integer, description: 'Máximo de pessoas pelo site naquele dia (o plano do dia e o evento podem baixar)' }
        party_too_large: { type: boolean, description: 'O grupo passa do máximo do dia; a janela segue o large_group_action' }
        duration_min: { type: integer, description: 'Tempo de mesa do dia para este grupo; vai para os combinados' }
        tolerance_min: { type: integer }
        cancel_until_hours: { type: integer }
    ListAvailability:
      type: [object, 'null']
      description: 'Lugares da lista por pessoa no dia (áreas em modo lista)'
      properties:
        capacity: { type: integer }
        remaining: { type: integer }
        state: { type: string, enum: [available, few_left, full] }
        entry_times: { type: array, items: { type: string, example: '20:00' } }
        waitlist_open: { type: boolean }
    EventSummary:
      type: [object, 'null']
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        starts_at: { type: string, example: '20:00' }
        booking_mode: { $ref: '#/components/schemas/EventBookingMode' }
        party_max: { type: [integer, 'null'] }
        requires_approval: { type: boolean }
        list_capacity: { type: [integer, 'null'], description: 'Pessoas na lista do evento' }
        tables_limit: { type: [integer, 'null'], description: 'No modo misto, quantas mesas vão ao site (3.10)' }
        reason_labels: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }], description: 'Motivo do evento privado nas três línguas' }
        title_i18n: { oneOf: [{ $ref: '#/components/schemas/LocalizedText' }, { type: 'null' }] }
    DaysResponse:
      type: object
      properties:
        server_time: { type: string, format: date-time }
        party_size: { type: integer }
        days: { type: array, items: { $ref: '#/components/schemas/DayAvailability' } }
    SlotsResponse:
      allOf:
        - $ref: '#/components/schemas/DayAvailability'
        - type: object
          properties:
            server_time: { type: string, format: date-time }

    # ---------- cliente
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, description: E.164, example: '+5545999990000' }
        website: { type: string, description: 'Campo invisível; robô que preencher é recusado' }
        turnstile_token: { type: string, description: 'Token do Turnstile, conferido no servidor (AD-14)' }
    OtpSent:
      type: object
      properties:
        expires_in_s: { type: integer, example: 600 }
        resend_after_s: { type: integer, example: 30 }
    OtpVerify:
      type: object
      required: [phone, code]
      properties:
        phone: { type: string }
        code: { type: string, pattern: '^\d{6}$' }
        name: { type: string, description: 'Obrigatório no primeiro acesso' }
        remember_device: { type: boolean }
        locale: { $ref: '#/components/schemas/Locale' }
    CustomerMe:
      type: object
      properties:
        name: { type: string }
        phone_masked: { type: [string, 'null'], example: '(45) 9••••-0000', description: 'Vazio numa conta nova pelo Google que ainda não verificou telefone' }
        phone_verified: { type: boolean, description: 'Falso = precisa verificar um telefone antes de reservar (AD-30)' }
        email: { type: [string, 'null'], format: email, description: 'Opcional; só para cópia do comprovante e novidades com opt-in' }
        locale: { $ref: '#/components/schemas/Locale' }
        marketing_opt_in: { type: boolean }
        google_linked: { type: boolean }
        csrf_token: { type: string, description: 'Token CSRF da sessão; a página guarda e manda em X-CSRF-Token' }
    CustomerMePatch:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        email: { type: [string, 'null'], format: email }
        locale: { $ref: '#/components/schemas/Locale' }
        marketing_opt_in: { type: boolean }
    PhoneChange:
      type: object
      required: [phone, code]
      properties:
        phone: { type: string, description: 'E.164 do número novo' }
        code: { type: string, pattern: '^\d{6}$', description: 'O código que POST /auth/otp mandou para o número novo' }
    CustomerSession:
      type: object
      properties:
        customer: { $ref: '#/components/schemas/CustomerMe' }
        csrf_token: { type: string }
    ReservationCreate:
      type: object
      required: [party_size, date, time, name, terms_version]
      properties:
        party_size: { type: integer, minimum: 1 }
        date: { type: string, format: date }
        time: { type: string, example: '20:30' }
        area_preference: { $ref: '#/components/schemas/AreaKeyNullable' }
        area_key: { $ref: '#/components/schemas/AreaKeyNullable', description: 'Área em modo lista, nos dias de evento' }
        name: { type: string, minLength: 2, maxLength: 60 }
        notes: { type: string, maxLength: 280 }
        flags: { type: array, items: { $ref: '#/components/schemas/Flag' } }
        terms_version: { type: string }
        event_id: { type: [string, 'null'], format: uuid }
        waitlist: { type: boolean, description: 'Verdadeiro para entrar na lista de espera de um horário lotado' }
        started_at: { type: string, format: date-time, description: 'Quando a pessoa abriu o formulário (tempo mínimo contra robô)' }
        locale: { $ref: '#/components/schemas/Locale' }
        turnstile_token: { type: string, description: 'Token do Turnstile, conferido no servidor (AD-14)' }
    ReservationPublic:
      type: object
      required: [code, date, time, party_size, status]
      properties:
        code: { type: string, example: TR-4821 }
        date: { type: string, format: date }
        time: { type: string }
        party_size: { type: integer }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        first_name: { type: string }
        area_preference: { $ref: '#/components/schemas/AreaKeyNullable' }
        area_key: { $ref: '#/components/schemas/AreaKeyNullable' }
        place: { type: string, enum: [table, list, door], description: 'Mesa, lista do evento ou entrada livre' }
        event_title: { type: [string, 'null'] }
        tolerance_until: { type: string, example: '20:50', description: 'Até quando a mesa é prioridade do cliente (horário + tolerância)' }
        tolerance_extra_until: { type: [string, 'null'], example: '21:00', description: 'Até quando, se ele avisar que vai atrasar (null se o aviso de atraso está desligado)' }
        late_notice_at: { type: [string, 'null'], format: date-time, description: 'Quando o cliente avisou que vai atrasar' }
        waitlist_position: { type: [integer, 'null'] }
        pending_until: { type: [string, 'null'], format: date-time }
        offer_expires_at: { type: [string, 'null'], format: date-time }
