#   - done: todas as histórias do épico prontas

# Situação da história:
#   - backlog: a história só existe no arquivo de épicos
#   - ready-for-dev: arquivo da história criado, pronta para fazer
#   - in-progress: alguém está fazendo
#   - review: feita, esperando revisão
#   - done: história pronta

# Situação da retrospectiva:
#   - optional: pode ser feita, mas não é obrigatória
#   - done: retrospectiva feita

# Situação dos itens de ação:
#   - open: combinado numa retrospectiva, ainda não resolvido
#   - in-progress: em andamento
#   - done: resolvido

# COMO FUNCIONA:
# ===============
